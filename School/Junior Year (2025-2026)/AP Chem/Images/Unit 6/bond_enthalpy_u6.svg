<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
  <title>Bond Enthalpy Calculation — Bonds Broken vs. Bonds Formed</title>
  <desc>Two-column diagram showing that bonds broken in reactants cost energy (positive, endothermic step) while bonds formed in products release energy (negative, exothermic step), with the net delta H formula.</desc>
  <style>
    .th { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; }
    .ts { font-family: Arial, sans-serif; font-size: 12px; fill: #334155; }
    .tss { font-family: Arial, sans-serif; font-size: 11px; fill: #475569; }
  </style>
  <defs>
    <marker id="arr-r" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#ef4444"/>
    </marker>
    <marker id="arr-g" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="680" height="320" fill="#f8fafc" rx="8"/>
  <text x="340" y="26" class="th" text-anchor="middle">Bond Enthalpy — ΔH_rxn = Σ(bonds broken) − Σ(bonds formed)</text>

  <!-- LEFT: BONDS BROKEN -->
  <rect x="16" y="40" width="308" height="226" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" rx="6"/>
  <rect x="16" y="40" width="308" height="30" fill="#ef4444" rx="6"/>
  <text x="170" y="61" class="th" text-anchor="middle" fill="white">BONDS BROKEN (Reactants)</text>

  <text x="170" y="90" class="ts" text-anchor="middle" fill="#991b1b">Energy is ABSORBED (+)</text>
  <text x="170" y="106" class="tss" text-anchor="middle" fill="#991b1b">Breaking bonds is always endothermic</text>

  <!-- energy arrow up -->
  <line x1="80" y1="200" x2="80" y2="135" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr-r)"/>
  <text x="86" y="175" class="tss" fill="#991b1b">energy</text>
  <text x="86" y="188" class="tss" fill="#991b1b">in (+)</text>

  <!-- Bond table -->
  <rect x="110" y="120" width="196" height="118" fill="white" stroke="#fca5a5" stroke-width="1" rx="3"/>
  <text x="148" y="138" class="tss" text-anchor="middle" fill="#991b1b" font-weight="bold">Bond</text>
  <text x="250" y="138" class="tss" text-anchor="middle" fill="#991b1b" font-weight="bold">BE (kJ/mol)</text>
  <line x1="112" y1="142" x2="304" y2="142" stroke="#fca5a5" stroke-width="1"/>
  <text x="148" y="158" class="tss" text-anchor="middle">C–H (×4)</text>
  <text x="250" y="158" class="tss" text-anchor="middle">4 × 414 = 1656</text>
  <line x1="112" y1="162" x2="304" y2="162" stroke="#fca5a5" stroke-width="0.5"/>
  <text x="148" y="178" class="tss" text-anchor="middle">O=O (×2)</text>
  <text x="250" y="178" class="tss" text-anchor="middle">2 × 498 = 996</text>
  <line x1="112" y1="182" x2="304" y2="182" stroke="#fca5a5" stroke-width="0.5"/>
  <text x="148" y="198" class="tss" text-anchor="middle" font-weight="bold">Total broken</text>
  <text x="250" y="198" class="tss" text-anchor="middle" font-weight="bold">+2652 kJ</text>
  <line x1="112" y1="202" x2="304" y2="202" stroke="#fca5a5" stroke-width="1"/>
  <text x="208" y="220" class="tss" text-anchor="middle" fill="#475569" font-style="italic">CH₄ + 2 O₂ example</text>
  <text x="208" y="232" class="tss" text-anchor="middle" fill="#475569" font-style="italic">(combustion of methane)</text>

  <!-- RIGHT: BONDS FORMED -->
  <rect x="356" y="40" width="308" height="226" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="6"/>
  <rect x="356" y="40" width="308" height="30" fill="#16a34a" rx="6"/>
  <text x="510" y="61" class="th" text-anchor="middle" fill="white">BONDS FORMED (Products)</text>

  <text x="510" y="90" class="ts" text-anchor="middle" fill="#15803d">Energy is RELEASED (−)</text>
  <text x="510" y="106" class="tss" text-anchor="middle" fill="#15803d">Forming bonds is always exothermic</text>

  <!-- energy arrow down -->
  <line x1="620" y1="135" x2="620" y2="200" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <text x="626" y="165" class="tss" fill="#15803d">energy</text>
  <text x="626" y="178" class="tss" fill="#15803d">out (−)</text>

  <!-- Bond table -->
  <rect x="368" y="120" width="240" height="118" fill="white" stroke="#86efac" stroke-width="1" rx="3"/>
  <text x="440" y="138" class="tss" text-anchor="middle" fill="#15803d" font-weight="bold">Bond</text>
  <text x="558" y="138" class="tss" text-anchor="middle" fill="#15803d" font-weight="bold">BE (kJ/mol)</text>
  <line x1="370" y1="142" x2="606" y2="142" stroke="#86efac" stroke-width="1"/>
  <text x="440" y="158" class="tss" text-anchor="middle">C=O (×2)</text>
  <text x="558" y="158" class="tss" text-anchor="middle">2 × 799 = 1598</text>
  <line x1="370" y1="162" x2="606" y2="162" stroke="#86efac" stroke-width="0.5"/>
  <text x="440" y="178" class="tss" text-anchor="middle">O–H (×4)</text>
  <text x="558" y="178" class="tss" text-anchor="middle">4 × 464 = 1856</text>
  <line x1="370" y1="182" x2="606" y2="182" stroke="#86efac" stroke-width="0.5"/>
  <text x="440" y="198" class="tss" text-anchor="middle" font-weight="bold">Total formed</text>
  <text x="558" y="198" class="tss" text-anchor="middle" font-weight="bold">3454 kJ</text>
  <line x1="370" y1="202" x2="606" y2="202" stroke="#86efac" stroke-width="1"/>
  <text x="488" y="220" class="tss" text-anchor="middle" fill="#475569" font-style="italic">→ CO₂ + 2 H₂O products</text>
  <text x="488" y="232" class="tss" text-anchor="middle" fill="#475569" font-style="italic">2 C=O in CO₂; 4 O–H in 2 H₂O</text>

  <!-- BOTTOM: NET ΔH -->
  <rect x="16" y="278" width="648" height="36" fill="#1e293b" rx="5"/>
  <text x="340" y="293" class="th" text-anchor="middle" fill="white">ΔH_rxn = Σ(bonds broken) − Σ(bonds formed) = +2652 − 3454 = −802 kJ/mol</text>
  <text x="340" y="308" class="tss" text-anchor="middle" fill="#94a3b8">Bond enthalpies give APPROXIMATE ΔH (averaged values). Standard enthalpies of formation give exact ΔH.</text>
</svg>
