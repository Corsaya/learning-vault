<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
  <title>Heating Curve with Phase Changes</title>
  <desc>Complete heating curve showing temperature vs. heat added for a substance going from solid through melting, liquid, boiling, and gas phases. Plateaus occur during phase transitions at constant temperature.</desc>
  <style>
    .th { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; }
    .ts { font-family: Arial, sans-serif; font-size: 12px; fill: #334155; }
    .tss { font-family: Arial, sans-serif; font-size: 11px; fill: #475569; }
  </style>
  <defs>
    <marker id="arr-k" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#555"/>
    </marker>
  </defs>

  <rect width="680" height="360" fill="#f8fafc" rx="8"/>
  <text x="340" y="26" class="th" text-anchor="middle">Heating Curve — Temperature vs. Heat Added</text>

  <!-- axes -->
  <line x1="58" y1="310" x2="648" y2="310" stroke="#555" stroke-width="1.5" marker-end="url(#arr-k)"/>
  <line x1="58" y1="310" x2="58" y2="42" stroke="#555" stroke-width="1.5" marker-end="url(#arr-k)"/>
  <text x="353" y="332" class="ts" text-anchor="middle">Heat Added (q)</text>
  <text x="22" y="180" class="ts" text-anchor="middle" transform="rotate(-90 22 180)">Temperature</text>

  <!-- Segment coordinates:
       A(65,285) → B(120,195): solid warming
       B(120,195) → C(200,195): melting plateau (Tmp)
       C(200,195) → D(310,120): liquid warming
       D(310,120) → E(490,120): boiling plateau (Tbp)
       E(490,120) → F(580,62): gas warming
  -->

  <!-- Segment 1: Solid warming (blue) -->
  <line x1="65" y1="285" x2="120" y2="195" stroke="#3b82f6" stroke-width="3"/>
  <!-- Segment 2: Melting plateau (purple) -->
  <line x1="120" y1="195" x2="200" y2="195" stroke="#7c3aed" stroke-width="3"/>
  <!-- Segment 3: Liquid warming (green) -->
  <line x1="200" y1="195" x2="310" y2="120" stroke="#16a34a" stroke-width="3"/>
  <!-- Segment 4: Boiling plateau (red) -->
  <line x1="310" y1="120" x2="490" y2="120" stroke="#ef4444" stroke-width="3"/>
  <!-- Segment 5: Gas warming (orange) -->
  <line x1="490" y1="120" x2="580" y2="62" stroke="#ca8a04" stroke-width="3"/>

  <!-- Phase regions (shaded backgrounds) -->
  <rect x="65" y="195" width="55" height="115" fill="#dbeafe" opacity="0.3"/>
  <rect x="200" y="120" width="110" height="75" fill="#dcfce7" opacity="0.3"/>
  <rect x="490" y="62" width="90" height="58" fill="#fef9c3" opacity="0.3"/>

  <!-- Melting point horizontal dashed line -->
  <line x1="58" y1="195" x2="620" y2="195" stroke="#7c3aed" stroke-width="1" stroke-dasharray="5,4" opacity="0.5"/>
  <!-- Boiling point horizontal dashed line -->
  <line x1="58" y1="120" x2="620" y2="120" stroke="#ef4444" stroke-width="1" stroke-dasharray="5,4" opacity="0.5"/>

  <!-- Y-axis labels -->
  <text x="52" y="199" class="tss" text-anchor="end" fill="#7c3aed">Tmp</text>
  <text x="52" y="124" class="tss" text-anchor="end" fill="#ef4444">Tbp</text>

  <!-- Segment labels -->
  <!-- Seg 1: Solid -->
  <rect x="56" y="240" width="60" height="18" fill="#dbeafe" rx="3"/>
  <text x="86" y="253" class="tss" text-anchor="middle" fill="#1d4ed8" font-weight="bold">SOLID</text>
  <text x="86" y="270" class="tss" text-anchor="middle" fill="#3b82f6">q = mcΔT</text>
  <text x="86" y="283" class="tss" text-anchor="middle" fill="#475569">(c of solid)</text>

  <!-- Seg 2: Melting plateau -->
  <rect x="116" y="165" width="90" height="18" fill="#ede9fe" rx="3"/>
  <text x="161" y="178" class="tss" text-anchor="middle" fill="#4c1d95" font-weight="bold">MELTING (Tmp)</text>
  <text x="161" y="154" class="tss" text-anchor="middle" fill="#7c3aed">q = nΔHfus</text>
  <text x="161" y="142" class="tss" text-anchor="middle" fill="#475569">T = constant</text>

  <!-- Seg 3: Liquid -->
  <rect x="216" y="150" width="80" height="18" fill="#dcfce7" rx="3"/>
  <text x="256" y="163" class="tss" text-anchor="middle" fill="#15803d" font-weight="bold">LIQUID</text>
  <text x="256" y="180" class="tss" text-anchor="middle" fill="#16a34a">q = mcΔT</text>
  <text x="256" y="194" class="tss" text-anchor="middle" fill="#475569">(c of liquid)</text>

  <!-- Seg 4: Boiling plateau -->
  <rect x="356" y="90" width="90" height="18" fill="#fee2e2" rx="3"/>
  <text x="401" y="103" class="tss" text-anchor="middle" fill="#991b1b" font-weight="bold">BOILING (Tbp)</text>
  <text x="401" y="80" class="tss" text-anchor="middle" fill="#ef4444">q = nΔHvap</text>
  <text x="401" y="68" class="tss" text-anchor="middle" fill="#475569">T = constant</text>

  <!-- Seg 5: Gas -->
  <rect x="497" y="90" width="65" height="18" fill="#fef9c3" rx="3"/>
  <text x="530" y="103" class="tss" text-anchor="middle" fill="#92400e" font-weight="bold">GAS</text>
  <text x="530" y="118" class="tss" text-anchor="middle" fill="#ca8a04">q = mcΔT</text>
  <text x="530" y="132" class="tss" text-anchor="middle" fill="#475569">(c of gas)</text>

  <!-- Key facts box -->
  <rect x="590" y="220" width="80" height="86" fill="white" stroke="#e2e8f0" stroke-width="1" rx="4"/>
  <text x="630" y="235" class="tss" text-anchor="middle" font-weight="bold" fill="#1e293b">KEY</text>
  <text x="598" y="250" class="tss" fill="#475569">Slopes:</text>
  <text x="598" y="263" class="tss" fill="#3b82f6">q = mcΔT</text>
  <text x="598" y="277" class="tss" fill="#475569">Plateaus:</text>
  <text x="598" y="290" class="tss" fill="#7c3aed">q = nΔH</text>
  <text x="598" y="303" class="tss" fill="#991b1b">T constant</text>

  <!-- Bottom note -->
  <text x="340" y="348" class="tss" text-anchor="middle">Plateaus: IMFs breaking (melting/boiling) — KE unchanged, PE increases | ΔHvap >> ΔHfus (vaporization plateau much wider)</text>
</svg>
