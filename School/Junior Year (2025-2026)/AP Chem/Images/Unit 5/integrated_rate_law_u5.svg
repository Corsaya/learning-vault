<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
  <title>Integrated Rate Law Linearization Plots</title>
  <desc>Three plots showing which graph is linear for zeroth, first, and second order reactions.</desc>
  <style>
    .th { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; }
    .ts { font-family: Arial, sans-serif; font-size: 12px; fill: #334155; }
    .tss { font-family: Arial, sans-serif; font-size: 11px; fill: #475569; }
    .tlabel { font-family: Arial, sans-serif; font-size: 11px; fill: #1d4ed8; font-weight: bold; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="0" y="0" width="680" height="420" fill="#f8fafc" rx="8"/>
  <text x="340" y="26" text-anchor="middle" class="th" font-size="15">Integrated Rate Law — Linearization Test</text>

  <!-- Panel 1: Zeroth Order -->
  <rect x="14" y="40" width="198" height="200" fill="#dcfce7" rx="6" stroke="#16a34a" stroke-width="1.5"/>
  <text x="113" y="58" text-anchor="middle" class="th" fill="#15803d" font-size="13">Zeroth Order</text>
  <text x="113" y="73" text-anchor="middle" class="ts" font-size="11">[A] = −kt + [A]₀</text>

  <!-- Axes panel 1 -->
  <line x1="40" y1="220" x2="40" y2="95" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="40" y1="220" x2="200" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="28" y="155" text-anchor="middle" class="ts" font-size="10" transform="rotate(-90 28 155)">[A]</text>
  <text x="120" y="234" text-anchor="middle" class="ts" font-size="10">Time</text>

  <!-- Linear line (zeroth order [A] vs t) -->
  <line x1="50" y1="105" x2="192" y2="215" stroke="#16a34a" stroke-width="2.5"/>
  <text x="113" y="252" text-anchor="middle" class="tlabel" fill="#15803d">LINEAR ✓</text>
  <text x="113" y="265" text-anchor="middle" class="tss">slope = −k</text>

  <!-- Panel 2: First Order -->
  <rect x="240" y="40" width="198" height="200" fill="#dbeafe" rx="6" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="339" y="58" text-anchor="middle" class="th" fill="#1d4ed8" font-size="13">First Order</text>
  <text x="339" y="73" text-anchor="middle" class="ts" font-size="11">ln[A] = −kt + ln[A]₀</text>

  <!-- Axes panel 2 -->
  <line x1="266" y1="220" x2="266" y2="95" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="266" y1="220" x2="426" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="254" y="155" text-anchor="middle" class="ts" font-size="10" transform="rotate(-90 254 155)">ln[A]</text>
  <text x="346" y="234" text-anchor="middle" class="ts" font-size="10">Time</text>

  <!-- Linear line (first order ln[A] vs t) -->
  <line x1="276" y1="105" x2="418" y2="215" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="339" y="252" text-anchor="middle" class="tlabel" fill="#1d4ed8">LINEAR ✓</text>
  <text x="339" y="265" text-anchor="middle" class="tss">slope = −k</text>

  <!-- Panel 3: Second Order -->
  <rect x="466" y="40" width="198" height="200" fill="#ede9fe" rx="6" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="565" y="58" text-anchor="middle" class="th" fill="#4c1d95" font-size="13">Second Order</text>
  <text x="565" y="73" text-anchor="middle" class="ts" font-size="11">1/[A] = kt + 1/[A]₀</text>

  <!-- Axes panel 3 -->
  <line x1="492" y1="220" x2="492" y2="95" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="492" y1="220" x2="652" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="480" y="155" text-anchor="middle" class="ts" font-size="10" transform="rotate(-90 480 155)">1/[A]</text>
  <text x="572" y="234" text-anchor="middle" class="ts" font-size="10">Time</text>

  <!-- Linear line (second order 1/[A] vs t) -->
  <line x1="502" y1="215" x2="644" y2="105" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="565" y="252" text-anchor="middle" class="tlabel" fill="#4c1d95">LINEAR ✓</text>
  <text x="565" y="265" text-anchor="middle" class="tss">slope = +k</text>

  <!-- Summary table -->
  <rect x="14" y="285" width="650" height="120" fill="#f1f5f9" rx="6" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="339" y="303" text-anchor="middle" class="th" font-size="13">Quick Reference: Which Plot is Linear?</text>

  <!-- Table headers -->
  <text x="90" y="323" text-anchor="middle" class="ts" font-weight="bold">Order</text>
  <text x="240" y="323" text-anchor="middle" class="ts" font-weight="bold">Linear Plot</text>
  <text x="400" y="323" text-anchor="middle" class="ts" font-weight="bold">Integrated Law</text>
  <text x="580" y="323" text-anchor="middle" class="ts" font-weight="bold">Half-life (t₁/₂)</text>
  <line x1="20" y1="328" x2="658" y2="328" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Row 0 -->
  <text x="90" y="345" text-anchor="middle" class="ts" fill="#15803d" font-weight="bold">0th</text>
  <text x="240" y="345" text-anchor="middle" class="ts">[A] vs. t</text>
  <text x="400" y="345" text-anchor="middle" class="ts">[A] = −kt + [A]₀</text>
  <text x="580" y="345" text-anchor="middle" class="ts">[A]₀ / 2k</text>

  <!-- Row 1 -->
  <text x="90" y="363" text-anchor="middle" class="ts" fill="#1d4ed8" font-weight="bold">1st</text>
  <text x="240" y="363" text-anchor="middle" class="ts">ln[A] vs. t</text>
  <text x="400" y="363" text-anchor="middle" class="ts">ln[A] = −kt + ln[A]₀</text>
  <text x="580" y="363" text-anchor="middle" class="ts">0.693 / k</text>

  <!-- Row 2 -->
  <text x="90" y="381" text-anchor="middle" class="ts" fill="#4c1d95" font-weight="bold">2nd</text>
  <text x="240" y="381" text-anchor="middle" class="ts">1/[A] vs. t</text>
  <text x="400" y="381" text-anchor="middle" class="ts">1/[A] = kt + 1/[A]₀</text>
  <text x="580" y="381" text-anchor="middle" class="ts">1 / (k[A]₀)</text>

  <text x="339" y="400" text-anchor="middle" class="tss" fill="#64748b">Memory rule: 0-1-2 → [A]-ln[A]-1/[A] | slope sign: 0th and 1st = negative; 2nd = positive</text>
</svg>
