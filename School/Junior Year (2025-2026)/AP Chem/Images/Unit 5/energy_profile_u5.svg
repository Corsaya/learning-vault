<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <title>Reaction Energy Profile: Catalyzed vs Uncatalyzed</title>
  <desc>Energy diagram comparing a single-step uncatalyzed reaction with a two-step catalyzed pathway showing lower activation energy.</desc>
  <style>
    .th { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; }
    .ts { font-family: Arial, sans-serif; font-size: 12px; fill: #334155; }
    .tss { font-family: Arial, sans-serif; font-size: 11px; fill: #475569; }
  </style>
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="arrl" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="400" fill="#f8fafc" rx="8"/>
  <text x="340" y="26" text-anchor="middle" class="th" font-size="15">Reaction Energy Profile: Catalyzed vs. Uncatalyzed</text>

  <!-- Axes -->
  <line x1="60" y1="340" x2="60" y2="45" stroke="#475569" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="60" y1="340" x2="650" y2="340" stroke="#475569" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="30" y="200" text-anchor="middle" class="ts" transform="rotate(-90 30 200)">Potential Energy</text>
  <text x="355" y="360" text-anchor="middle" class="ts">Reaction Progress</text>

  <!-- Reactants level -->
  <line x1="65" y1="270" x2="120" y2="270" stroke="#334155" stroke-width="2"/>
  <text x="75" y="288" class="tss">Reactants</text>

  <!-- Products level -->
  <line x1="560" y1="310" x2="640" y2="310" stroke="#334155" stroke-width="2"/>
  <text x="568" y="328" class="tss">Products</text>

  <!-- UNCATALYZED pathway (red/dashed) - single high peak -->
  <!-- Bezier curve up to high peak then down to products -->
  <path d="M 120,270 C 160,270 190,80 280,75 C 370,70 410,310 560,310"
        fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="8,4"/>

  <!-- Uncatalyzed peak label -->
  <text x="282" y="62" text-anchor="middle" class="tss" fill="#991b1b" font-weight="bold">TS (uncatalyzed)</text>
  <circle cx="280" cy="75" r="4" fill="#ef4444"/>

  <!-- Ea uncatalyzed arrow -->
  <line x1="350" y1="270" x2="350" y2="82" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr2)" marker-start="url(#arrl)" stroke-dasharray="4,3"/>
  <rect x="352" y="155" width="68" height="16" fill="#fee2e2" rx="3"/>
  <text x="356" y="167" class="tss" fill="#991b1b" font-weight="bold">Ea (uncat.)</text>

  <!-- CATALYZED pathway (blue/solid) - two lower peaks -->
  <!-- First peak -->
  <path d="M 120,270 C 155,270 175,175 220,168 C 265,162 275,230 310,230"
        fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <!-- Intermediate valley -->
  <path d="M 310,230 C 345,230 365,145 410,140 C 455,135 470,310 560,310"
        fill="none" stroke="#3b82f6" stroke-width="2.5"/>

  <!-- Catalyzed first TS -->
  <circle cx="220" cy="168" r="4" fill="#3b82f6"/>
  <text x="210" y="158" text-anchor="middle" class="tss" fill="#1d4ed8" font-weight="bold">TS₁</text>

  <!-- Intermediate -->
  <circle cx="310" cy="230" r="4" fill="#3b82f6"/>
  <text x="310" y="248" text-anchor="middle" class="tss" fill="#1d4ed8">intermediate</text>

  <!-- Catalyzed second TS -->
  <circle cx="410" cy="140" r="4" fill="#3b82f6"/>
  <text x="420" y="132" text-anchor="middle" class="tss" fill="#1d4ed8" font-weight="bold">TS₂</text>

  <!-- Ea catalyzed arrow (first, lower barrier) -->
  <line x1="155" y1="270" x2="155" y2="175" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr2)" marker-start="url(#arrl)"/>
  <rect x="100" y="215" width="48" height="16" fill="#dbeafe" rx="3"/>
  <text x="104" y="227" class="tss" fill="#1d4ed8" font-weight="bold">Ea (cat.)</text>

  <!-- Legend -->
  <rect x="420" y="50" width="240" height="80" fill="#f1f5f9" rx="6" stroke="#e2e8f0" stroke-width="1"/>
  <text x="540" y="68" text-anchor="middle" class="ts" font-weight="bold">Legend</text>
  <line x1="432" y1="82" x2="470" y2="82" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="476" y="86" class="ts">Uncatalyzed (high Ea)</text>
  <line x1="432" y1="102" x2="470" y2="102" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="476" y="106" class="ts">Catalyzed (lower Ea)</text>

  <!-- Key facts box -->
  <rect x="14" y="360" width="650" height="32" fill="#fef9c3" rx="5" stroke="#ca8a04" stroke-width="1"/>
  <text x="339" y="373" text-anchor="middle" class="ts" fill="#92400e" font-weight="bold">Same ΔE (reactants → products) for both pathways. Catalyst lowers Ea only — does NOT change ΔH.</text>
  <text x="339" y="388" text-anchor="middle" class="tss" fill="#92400e">Catalyzed path: multiple steps + intermediate | Uncatalyzed: single step | Both: same start and end energy</text>
</svg>
