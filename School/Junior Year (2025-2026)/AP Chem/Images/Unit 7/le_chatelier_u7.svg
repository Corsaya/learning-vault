<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" font-family="serif" font-size="13">
  <rect width="700" height="370" fill="#fafafa" rx="6"/>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Le Chatelier's Principle — Stress and Response</text>
  <text x="350" y="42" text-anchor="middle" font-size="12" fill="#555">aA + bB ⇌ cC + dD   (ΔH &lt; 0 for this example — exothermic forward)</text>

  <!-- Table header -->
  <rect x="30" y="55" width="640" height="28" fill="#334" rx="3"/>
  <text x="130" y="74" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Stress Applied</text>
  <text x="350" y="74" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Effect on Q</text>
  <text x="540" y="74" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Shift Direction</text>

  <!-- Rows -->
  <!-- Row 1 -->
  <rect x="30" y="83" width="640" height="30" fill="#e8f0fe"/>
  <text x="130" y="103" text-anchor="middle" font-size="12" fill="#333">Add reactant (A or B)</text>
  <text x="350" y="103" text-anchor="middle" font-size="12" fill="#b22">Q decreases below K</text>
  <text x="540" y="103" text-anchor="middle" font-size="12" fill="#226" font-weight="bold">→ Forward (more products)</text>

  <!-- Row 2 -->
  <rect x="30" y="113" width="640" height="30" fill="#fff"/>
  <text x="130" y="133" text-anchor="middle" font-size="12" fill="#333">Remove reactant (A or B)</text>
  <text x="350" y="133" text-anchor="middle" font-size="12" fill="#b22">Q increases above K</text>
  <text x="540" y="133" text-anchor="middle" font-size="12" fill="#622" font-weight="bold">← Reverse (more reactants)</text>

  <!-- Row 3 -->
  <rect x="30" y="143" width="640" height="30" fill="#e8f0fe"/>
  <text x="130" y="163" text-anchor="middle" font-size="12" fill="#333">Add product (C or D)</text>
  <text x="350" y="163" text-anchor="middle" font-size="12" fill="#b22">Q increases above K</text>
  <text x="540" y="163" text-anchor="middle" font-size="12" fill="#622" font-weight="bold">← Reverse</text>

  <!-- Row 4 -->
  <rect x="30" y="173" width="640" height="30" fill="#fff"/>
  <text x="130" y="193" text-anchor="middle" font-size="12" fill="#333">Remove product (C or D)</text>
  <text x="350" y="193" text-anchor="middle" font-size="12" fill="#b22">Q decreases below K</text>
  <text x="540" y="193" text-anchor="middle" font-size="12" fill="#226" font-weight="bold">→ Forward</text>

  <!-- Row 5 -->
  <rect x="30" y="203" width="640" height="30" fill="#e8f0fe"/>
  <text x="130" y="223" text-anchor="middle" font-size="12" fill="#333">Decrease volume (↑ P)</text>
  <text x="350" y="223" text-anchor="middle" font-size="12" fill="#b22">Q changes (unequal gas moles)</text>
  <text x="540" y="223" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">→ Side with fewer gas mol</text>

  <!-- Row 6 -->
  <rect x="30" y="233" width="640" height="30" fill="#fff"/>
  <text x="130" y="253" text-anchor="middle" font-size="12" fill="#333">Increase volume (↓ P)</text>
  <text x="350" y="253" text-anchor="middle" font-size="12" fill="#b22">Q changes (unequal gas moles)</text>
  <text x="540" y="253" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">→ Side with more gas mol</text>

  <!-- Row 7 — temperature — special background -->
  <rect x="30" y="263" width="640" height="30" fill="#fff9e6"/>
  <text x="130" y="283" text-anchor="middle" font-size="12" fill="#333">Increase temperature</text>
  <text x="350" y="283" text-anchor="middle" font-size="12" fill="#aa5500">K changes (not just Q)</text>
  <text x="540" y="283" text-anchor="middle" font-size="12" fill="#226" font-weight="bold">→ Endothermic direction</text>

  <!-- Row 8 -->
  <rect x="30" y="293" width="640" height="30" fill="#fff9e6"/>
  <text x="130" y="313" text-anchor="middle" font-size="12" fill="#333">Decrease temperature</text>
  <text x="350" y="313" text-anchor="middle" font-size="12" fill="#aa5500">K changes (not just Q)</text>
  <text x="540" y="313" text-anchor="middle" font-size="12" fill="#622" font-weight="bold">← Exothermic direction</text>

  <!-- Row 9 -->
  <rect x="30" y="323" width="640" height="30" fill="#f0f0f0"/>
  <text x="130" y="343" text-anchor="middle" font-size="12" fill="#555">Add catalyst</text>
  <text x="350" y="343" text-anchor="middle" font-size="12" fill="#555">No change to Q or K</text>
  <text x="540" y="343" text-anchor="middle" font-size="12" fill="#555">No shift — reaches equil. faster</text>

  <!-- Border lines -->
  <line x1="240" y1="55" x2="240" y2="353" stroke="#ccc" stroke-width="1"/>
  <line x1="460" y1="55" x2="460" y2="353" stroke="#ccc" stroke-width="1"/>
  <rect x="30" y="55" width="640" height="298" fill="none" stroke="#888" stroke-width="1.5" rx="3"/>

  <!-- Footer note -->
  <text x="350" y="365" text-anchor="middle" font-size="11" fill="#aa5500" font-weight="bold">★ Temperature uniquely changes K itself — all other stresses only change Q.</text>
</svg>
