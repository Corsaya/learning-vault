<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="serif" font-size="14">
  <!-- Background -->
  <rect width="700" height="320" fill="#fafafa" rx="6"/>
  <text x="350" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Concentration–Time Graph: Equilibrium</text>
  <text x="350" y="40" text-anchor="middle" font-size="12" fill="#555">N₂O₄(g) ⇌ 2 NO₂(g) — equilibrium reached when both curves flatten</text>

  <!-- Axes -->
  <line x1="70" y1="260" x2="620" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="60" x2="70" y2="260" stroke="#333" stroke-width="2"/>
  <!-- Axis labels -->
  <text x="345" y="290" text-anchor="middle" font-size="13" fill="#333">Time</text>
  <text x="18" y="165" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90,18,165)">Concentration (M)</text>

  <!-- Equilibrium vertical line -->
  <line x1="400" y1="65" x2="400" y2="260" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="403" y="75" font-size="11" fill="#777">Equilibrium</text>
  <text x="403" y="89" font-size="11" fill="#777">established</text>

  <!-- N₂O₄ curve: starts high (~200px from top = 60px y), falls to ~140px y, then flat -->
  <!-- y-axis: 60 = high, 240 = low. Concentration high = low y value -->
  <path d="M70,85 C140,88 220,120 310,155 C360,170 385,178 400,180 L620,180"
        fill="none" stroke="#2255cc" stroke-width="2.5"/>
  <text x="625" y="183" font-size="12" fill="#2255cc" font-weight="bold">N₂O₄</text>

  <!-- NO₂ curve: starts low (~240px y), rises to ~145px y, then flat -->
  <path d="M70,235 C140,230 220,205 310,175 C360,162 385,155 400,153 L620,153"
        fill="none" stroke="#cc3322" stroke-width="2.5"/>
  <text x="625" y="156" font-size="12" fill="#cc3322" font-weight="bold">NO₂</text>

  <!-- Y-axis ticks and labels -->
  <line x1="65" y1="85" x2="70" y2="85" stroke="#333" stroke-width="1.5"/>
  <text x="60" y="89" text-anchor="end" font-size="11" fill="#333">0.40</text>
  <line x1="65" y1="153" x2="70" y2="153" stroke="#333" stroke-width="1.5"/>
  <text x="60" y="157" text-anchor="end" font-size="11" fill="#333">0.26</text>
  <line x1="65" y1="180" x2="70" y2="180" stroke="#333" stroke-width="1.5"/>
  <text x="60" y="184" text-anchor="end" font-size="11" fill="#333">0.21</text>
  <line x1="65" y1="235" x2="70" y2="235" stroke="#333" stroke-width="1.5"/>
  <text x="60" y="239" text-anchor="end" font-size="11" fill="#333">0.00</text>

  <!-- Annotations -->
  <text x="200" y="145" font-size="11" fill="#2255cc">N₂O₄ decomposing</text>
  <text x="200" y="222" font-size="11" fill="#cc3322">NO₂ forming</text>
  <rect x="69" y="59" width="185" height="18" fill="#fffde7" rx="3" opacity="0.9"/>
  <text x="162" y="72" text-anchor="middle" font-size="11" fill="#777" font-style="italic">Not equilibrium — concentrations changing</text>
  <rect x="400" y="59" width="220" height="18" fill="#e8f5e9" rx="3" opacity="0.9"/>
  <text x="510" y="72" text-anchor="middle" font-size="11" fill="#338844" font-style="italic">Equilibrium — concentrations constant</text>

  <!-- Key note -->
  <rect x="70" y="270" width="560" height="40" fill="#f0f4ff" rx="4"/>
  <text x="350" y="285" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Key: Equal concentrations (crossing point) ≠ equilibrium.</text>
  <text x="350" y="300" text-anchor="middle" font-size="11" fill="#333">Equilibrium = flat curves. The two curves need not cross or be equal at equilibrium.</text>
</svg>
