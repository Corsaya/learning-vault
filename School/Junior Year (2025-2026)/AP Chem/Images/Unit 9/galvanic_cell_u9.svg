<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
  <title>Galvanic Cell Diagram — AP Chem Unit 9</title>
  <style>
    .th  { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; }
    .ts  { font-family: Arial, sans-serif; font-size: 12px; fill: #334155; }
    .tss { font-family: Arial, sans-serif; font-size: 11px; fill: #475569; }
    .lbl { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; }
    .ann { font-family: Arial, sans-serif; font-size: 11px; fill: #1d4ed8; }
  </style>
  <defs>
    <marker id="earr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1d4ed8"/>
    </marker>
    <marker id="iarr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
    <marker id="rarr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="420" fill="#f8fafc" rx="8"/>
  <text x="340" y="24" class="th" text-anchor="middle" font-size="15px">Galvanic (Voltaic) Cell — Component Diagram</text>

  <!-- ── External circuit / wire ── -->
  <!-- Wire left side -->
  <line x1="130" y1="80" x2="130" y2="52" stroke="#1d4ed8" stroke-width="3"/>
  <line x1="130" y1="52" x2="540" y2="52" stroke="#1d4ed8" stroke-width="3"/>
  <!-- Wire right side -->
  <line x1="540" y1="52" x2="540" y2="80" stroke="#1d4ed8" stroke-width="3" marker-end="url(#earr)"/>
  <!-- Electron flow arrow on wire -->
  <text x="335" y="46" class="ann" text-anchor="middle" fill="#1d4ed8">e⁻ flow →</text>
  <text x="270" y="66" class="tss" text-anchor="middle" fill="#1d4ed8">(electrons leave anode,</text>
  <text x="415" y="66" class="tss" text-anchor="middle" fill="#1d4ed8">travel through wire,</text>
  <text x="335" y="76" class="tss" text-anchor="middle" fill="#1d4ed8">enter cathode)</text>

  <!-- ── ANODE (left beaker) ── -->
  <!-- Beaker outline -->
  <rect x="30" y="100" width="200" height="220" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" rx="4"/>
  <!-- Solution fill -->
  <rect x="32" y="180" width="196" height="138" fill="#fef08a" opacity="0.4" rx="2"/>
  <!-- Electrode (Zn strip) -->
  <rect x="118" y="80" width="24" height="220" fill="#94a3b8" stroke="#64748b" stroke-width="1.5" rx="2"/>
  <!-- Mass loss annotation -->
  <text x="130" y="78"  class="tss" text-anchor="middle" fill="#dc2626">↑ connects to wire</text>

  <!-- Anode labels -->
  <text x="130" y="116" class="lbl" text-anchor="middle" fill="#92400e">ANODE</text>
  <text x="130" y="132" class="ts"  text-anchor="middle" fill="#92400e">Oxidation</text>
  <text x="130" y="148" class="tss" text-anchor="middle" fill="#dc2626">Mass DECREASES</text>
  <text x="130" y="164" class="tss" text-anchor="middle">(metal dissolves → ions)</text>

  <!-- Zn label -->
  <text x="152" y="200" class="ts" fill="#475569">Zn electrode</text>
  <text x="152" y="216" class="tss" fill="#475569">Zn → Zn²⁺ + 2e⁻</text>

  <!-- Solution label -->
  <text x="130" y="276" class="ts"  text-anchor="middle">ZnSO₄(aq)</text>
  <text x="130" y="292" class="tss" text-anchor="middle">[Zn²⁺] increases</text>
  <text x="130" y="308" class="tss" text-anchor="middle">as Zn dissolves</text>

  <!-- ── CATHODE (right beaker) ── -->
  <rect x="440" y="100" width="200" height="220" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="4"/>
  <rect x="442" y="180" width="196" height="138" fill="#bfdbfe" opacity="0.4" rx="2"/>
  <!-- Electrode (Cu strip) -->
  <rect x="528" y="80" width="24" height="220" fill="#d97706" stroke="#b45309" stroke-width="1.5" rx="2"/>
  <text x="540" y="78" class="tss" text-anchor="middle" fill="#1d4ed8">↑ connects to wire</text>

  <!-- Cathode labels -->
  <text x="540" y="116" class="lbl" text-anchor="middle" fill="#1e3a8a">CATHODE</text>
  <text x="540" y="132" class="ts"  text-anchor="middle" fill="#1e3a8a">Reduction</text>
  <text x="540" y="148" class="tss" text-anchor="middle" fill="#16a34a">Mass INCREASES</text>
  <text x="540" y="164" class="tss" text-anchor="middle">(ions deposit → metal)</text>

  <text x="562" y="200" class="ts"  fill="#475569">Cu electrode</text>
  <text x="562" y="216" class="tss" fill="#475569">Cu²⁺ + 2e⁻ → Cu</text>

  <text x="540" y="276" class="ts"  text-anchor="middle">CuSO₄(aq)</text>
  <text x="540" y="292" class="tss" text-anchor="middle">[Cu²⁺] decreases</text>
  <text x="540" y="308" class="tss" text-anchor="middle">as Cu deposits</text>

  <!-- ── Salt bridge ── -->
  <rect x="240" y="188" width="190" height="36" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" rx="8"/>
  <text x="335" y="208" class="lbl" text-anchor="middle">Salt Bridge (KNO₃)</text>
  <!-- Ion flow arrows in salt bridge -->
  <line x1="280" y1="215" x2="250" y2="215" stroke="#16a34a" stroke-width="1.5" marker-end="url(#rarr)"/>
  <text x="260" y="228" class="tss" fill="#dc2626">NO₃⁻ →</text>
  <line x1="390" y1="215" x2="420" y2="215" stroke="#16a34a" stroke-width="1.5" marker-end="url(#iarr)"/>
  <text x="400" y="228" class="tss" fill="#16a34a">← K⁺</text>

  <!-- Salt bridge annotation -->
  <text x="335" y="244" class="tss" text-anchor="middle" fill="#475569">Anions → anode; Cations → cathode</text>
  <text x="335" y="258" class="tss" text-anchor="middle" fill="#475569">(maintains electrical neutrality)</text>

  <!-- ── Bottom summary row ── -->
  <rect x="16" y="332" width="646" height="76" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="340" y="350" class="lbl" text-anchor="middle">Key Equations</text>
  <text x="110" y="370" class="ts" text-anchor="middle">E°cell = E°cathode − E°anode</text>
  <text x="340" y="370" class="ts" text-anchor="middle">ΔG° = −nFE°cell</text>
  <text x="565" y="370" class="ts" text-anchor="middle">Spontaneous: E°cell > 0, ΔG° &lt; 0</text>
  <text x="110" y="390" class="tss" text-anchor="middle">Never flip or multiply E° values</text>
  <text x="340" y="390" class="tss" text-anchor="middle">n = e⁻ from balanced half-reactions</text>
  <text x="565" y="390" class="tss" text-anchor="middle">Oxidation always at anode (both cell types)</text>
  <text x="340" y="403" class="tss" text-anchor="middle" fill="#dc2626">Inert electrode (Pt or graphite) when reactant/product is a gas or dissolved species</text>
</svg>
