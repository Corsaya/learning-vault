<svg width="100%" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Mass spectrum weighted average for bromine</title>
<desc>Bar chart showing two isotope peaks for bromine. 79Br at 50.7% abundance and 81Br at 49.3% abundance. The weighted average of 80.0 amu falls between the peaks, marked with a dashed red line. The taller peak pulls the average toward it.</desc>
<style>
  text { font-family: system-ui, -apple-system, sans-serif; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; }
  .axis { stroke: #555; stroke-width: 1; fill: none; }
  .grid { stroke: #e5e5e5; stroke-width: 0.5; stroke-dasharray: 4,3; }
</style>
<rect x="0" y="0" width="680" height="360" fill="#f8fafc" rx="8"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  </marker>
</defs>

<!-- Axes -->
<line class="axis" x1="90" y1="260" x2="610" y2="260" marker-end="url(#arr)"/>
<line class="axis" x1="90" y1="260" x2="90" y2="50" marker-end="url(#arr)"/>

<!-- Axis labels -->
<text class="ts" x="350" y="310" text-anchor="middle" fill="#444">Atomic Mass (amu)</text>
<text class="ts" x="28" y="162" text-anchor="middle" fill="#444" transform="rotate(-90,28,162)">Relative Abundance (%)</text>

<!-- Y gridlines -->
<line class="grid" x1="90" y1="160" x2="604" y2="160"/>
<line class="grid" x1="90" y1="110" x2="604" y2="110"/>
<text class="ts" x="82" y="164" text-anchor="end" fill="#999">50%</text>
<text class="ts" x="82" y="114" text-anchor="end" fill="#999">75%</text>
<text class="ts" x="82" y="264" text-anchor="end" fill="#999">0%</text>

<!-- X axis ticks -->
<line x1="200" y1="256" x2="200" y2="265" stroke="#888" stroke-width="1"/>
<line x1="400" y1="256" x2="400" y2="265" stroke="#888" stroke-width="1"/>
<text class="ts" x="200" y="278" text-anchor="middle" fill="#555">79</text>
<text class="ts" x="400" y="278" text-anchor="middle" fill="#555">81</text>
<text class="ts" x="300" y="278" text-anchor="middle" fill="#bbb">80</text>

<!-- PEAK 1: 79Br, 50.7% → height = 50.7% of 210px = ~107px -->
<rect x="152" y="153" width="96" height="107" rx="3" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1"/>
<text class="th" x="200" y="141" text-anchor="middle" fill="#1d4ed8">50.7%</text>
<text class="ts" x="200" y="290" text-anchor="middle" fill="#3b82f6">⁷⁹Br</text>

<!-- PEAK 2: 81Br, 49.3% → height = ~104px -->
<rect x="352" y="156" width="96" height="104" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
<text class="th" x="400" y="144" text-anchor="middle" fill="#15803d">49.3%</text>
<text class="ts" x="400" y="290" text-anchor="middle" fill="#16a34a">⁸¹Br</text>

<!-- Average line at 80.0 amu — x=300 (midpoint between 200 and 400) -->
<line x1="300" y1="68" x2="300" y2="268" stroke="#dc2626" stroke-width="2" stroke-dasharray="7,4"/>
<rect x="218" y="58" width="164" height="26" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.5"/>
<text class="th" x="300" y="76" text-anchor="middle" fill="#b91c1c">avg = 80.0 amu</text>

<!-- Annotation arrow: average pulls toward taller peak -->
<line x1="220" y1="120" x2="292" y2="100" stroke="#dc2626" stroke-width="0.8" stroke-dasharray="3,2"/>
<text class="ts" x="215" y="118" text-anchor="end" fill="#dc2626">average near</text>
<text class="ts" x="215" y="130" text-anchor="end" fill="#dc2626">taller peak</text>

<!-- Calculation strip -->
<rect x="90" y="318" width="500" height="26" rx="5" fill="#f9fafb" stroke="#e5e7eb" stroke-width="0.5"/>
<text class="ts" x="340" y="335" text-anchor="middle" fill="#555">m&#773; = (79)(0.507) + (81)(0.493) = 40.05 + 39.93 = 80.0 amu  →  Bromine (Br)</text>
</svg>
