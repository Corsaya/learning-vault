<svg width="100%" viewBox="0 0 680 430" role="img" xmlns="http://www.w3.org/2000/svg">
<title>PES spectrum of nitrogen</title>
<desc>Photoelectron spectrum of nitrogen showing three peaks. 1s at highest binding energy height 2, 2s at medium binding energy height 2, 2p at lowest binding energy height 3. Total electrons 7, element is nitrogen.</desc>
<style>
  text { font-family: system-ui, -apple-system, sans-serif; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; }
  .axis { stroke: #555; stroke-width: 1; fill: none; }
  .grid { stroke: #ddd; stroke-width: 0.5; stroke-dasharray: 4,3; }
  .anno { stroke: #bbb; stroke-width: 0.5; stroke-dasharray: 3,2; }
  .box { fill: #f5f5f5; stroke: #ccc; stroke-width: 0.5; }
</style>
<rect x="0" y="0" width="680" height="430" fill="#f8fafc" rx="8"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  </marker>
  <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#bbb" stroke-width="1.5" stroke-linecap="round"/>
  </marker>
  <marker id="arr3" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M8 1L2 5L8 9" fill="none" stroke="#bbb" stroke-width="1.5" stroke-linecap="round"/>
  </marker>
</defs>

<!-- Axes -->
<line class="axis" x1="80" y1="310" x2="625" y2="310" marker-end="url(#arr)"/>
<line class="axis" x1="80" y1="310" x2="80" y2="52" marker-end="url(#arr)"/>

<!-- Axis labels -->
<text class="ts" x="350" y="368" text-anchor="middle" fill="#444">Binding Energy (MJ/mol) — increases left to right →</text>
<text class="ts" x="22" y="185" text-anchor="middle" fill="#444" transform="rotate(-90,22,185)">Relative Number of Electrons</text>

<!-- Y-axis tick labels -->
<text class="ts" x="72" y="206" text-anchor="end" fill="#888">2</text>
<text class="ts" x="72" y="154" text-anchor="end" fill="#888">3</text>
<line class="grid" x1="80" y1="202" x2="620" y2="202"/>
<line class="grid" x1="80" y1="150" x2="620" y2="150"/>

<!-- PEAK 1: 1s — leftmost, binding energy ~40 MJ/mol, height=2 (104px tall) -->
<rect x="130" y="202" width="56" height="108" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.8"/>
<text class="th" x="158" y="192" text-anchor="middle" fill="#1d4ed8">1s</text>
<text class="ts" x="158" y="326" text-anchor="middle" fill="#555">~40 MJ/mol</text>

<!-- bracket showing height=2 -->
<line class="anno" x1="104" y1="202" x2="128" y2="202"/>
<line class="anno" x1="104" y1="310" x2="128" y2="310"/>
<line class="anno" x1="106" y1="208" x2="106" y2="304" marker-end="url(#arr2)" marker-start="url(#arr3)"/>
<text class="ts" x="92" y="260" text-anchor="middle" fill="#aaa">2e⁻</text>

<!-- PEAK 2: 2s — middle, height=2 -->
<rect x="295" y="202" width="56" height="108" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
<text class="th" x="323" y="192" text-anchor="middle" fill="#15803d">2s</text>
<text class="ts" x="323" y="326" text-anchor="middle" fill="#555">~3.9 MJ/mol</text>

<!-- PEAK 3: 2p — rightmost, height=3 (156px tall) -->
<rect x="460" y="150" width="56" height="160" rx="3" fill="#fef9c3" stroke="#ca8a04" stroke-width="0.8"/>
<text class="th" x="488" y="140" text-anchor="middle" fill="#92400e">2p</text>
<text class="ts" x="488" y="326" text-anchor="middle" fill="#555">~1.4 MJ/mol</text>

<!-- bracket showing height=3 -->
<line class="anno" x1="518" y1="150" x2="542" y2="150"/>
<line class="anno" x1="518" y1="310" x2="542" y2="310"/>
<line class="anno" x1="540" y1="156" x2="540" y2="304" marker-end="url(#arr2)" marker-start="url(#arr3)"/>
<text class="ts" x="556" y="234" text-anchor="start" fill="#aaa">3e⁻</text>

<!-- Callout box -->
<rect class="box" x="192" y="66" width="228" height="50" rx="6"/>
<text class="ts" x="306" y="86" text-anchor="middle" fill="#555">Total electrons: 2 + 2 + 3 = 7</text>
<text class="th" x="306" y="106" text-anchor="middle" fill="#1a1a1a">Element: Nitrogen (N)</text>

<!-- Two key rules at bottom -->
<rect class="box" x="80" y="390" width="248" height="30" rx="5"/>
<text class="ts" x="204" y="410" text-anchor="middle" fill="#555">Peak position = binding energy</text>
<rect class="box" x="352" y="390" width="248" height="30" rx="5"/>
<text class="ts" x="476" y="410" text-anchor="middle" fill="#555">Peak height = number of electrons</text>

<!-- Separator arrow annotation: leftmost = inner -->
<text class="ts" x="158" y="350" text-anchor="middle" fill="#3b82f6">← innermost (1s)</text>
<text class="ts" x="488" y="350" text-anchor="middle" fill="#ca8a04">valence (2p) →</text>
</svg>
