<svg width="100%" viewBox="0 0 680 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Periodic trends in atomic radius and ionization energy</title>
<desc>Grid of element circles showing atomic radius decreasing across a period and increasing down a group. Ionization energy trends in the opposite direction. Elements shown: Li, Be, B, C in period 2; Na, Mg, Al, Si in period 3; K, Ca, Ga, Ge in period 4.</desc>
<style>
  text { font-family: system-ui, -apple-system, sans-serif; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; }
  .sym { font-size: 13px; font-weight: 700; }
  .pm { font-size: 11px; }
</style>
<rect x="0" y="0" width="680" height="380" fill="#f8fafc" rx="8"/>
<defs>
  <marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
  </marker>
  <marker id="ari" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>
  </marker>
  <marker id="ari2" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M8 1L2 5L8 9" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>
  </marker>
  <marker id="ard2" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M8 1L2 5L8 9" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
  </marker>
</defs>

<!-- Period labels -->
<text class="ts" x="76" y="118" text-anchor="end" fill="#888">Period 2</text>
<text class="ts" x="76" y="218" text-anchor="end" fill="#888">Period 3</text>
<text class="ts" x="76" y="318" text-anchor="end" fill="#888">Period 4</text>

<!-- Group labels -->
<text class="ts" x="170" y="56" text-anchor="middle" fill="#888">Group 1</text>
<text class="ts" x="310" y="56" text-anchor="middle" fill="#888">Group 2</text>
<text class="ts" x="430" y="56" text-anchor="middle" fill="#888">Group 13</text>
<text class="ts" x="550" y="56" text-anchor="middle" fill="#888">Group 14</text>

<!-- ── PERIOD 2 ── -->
<!-- Li: 152 pm -->
<circle cx="170" cy="118" r="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.8"/>
<text class="sym" x="170" y="113" text-anchor="middle" fill="#1e40af">Li</text>
<text class="pm" x="170" y="128" text-anchor="middle" fill="#3b82f6">152 pm</text>

<!-- Be: 112 pm -->
<circle cx="310" cy="118" r="30" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.8"/>
<text class="sym" x="310" y="113" text-anchor="middle" fill="#1e40af">Be</text>
<text class="pm" x="310" y="128" text-anchor="middle" fill="#3b82f6">112 pm</text>

<!-- B: 87 pm -->
<circle cx="430" cy="118" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.8"/>
<text class="sym" x="430" y="113" text-anchor="middle" fill="#1e40af">B</text>
<text class="pm" x="430" y="128" text-anchor="middle" fill="#3b82f6">87 pm</text>

<!-- C: 77 pm -->
<circle cx="550" cy="118" r="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.8"/>
<text class="sym" x="550" y="113" text-anchor="middle" fill="#1e40af">C</text>
<text class="pm" x="550" y="128" text-anchor="middle" fill="#3b82f6">77 pm</text>

<!-- ── PERIOD 3 ── -->
<!-- Na: 186 pm -->
<circle cx="170" cy="218" r="48" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
<text class="sym" x="170" y="213" text-anchor="middle" fill="#14532d">Na</text>
<text class="pm" x="170" y="228" text-anchor="middle" fill="#16a34a">186 pm</text>

<!-- Mg: 160 pm -->
<circle cx="310" cy="218" r="40" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
<text class="sym" x="310" y="213" text-anchor="middle" fill="#14532d">Mg</text>
<text class="pm" x="310" y="228" text-anchor="middle" fill="#16a34a">160 pm</text>

<!-- Al: 143 pm -->
<circle cx="430" cy="218" r="32" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
<text class="sym" x="430" y="213" text-anchor="middle" fill="#14532d">Al</text>
<text class="pm" x="430" y="228" text-anchor="middle" fill="#16a34a">143 pm</text>

<!-- Si: 117 pm -->
<circle cx="550" cy="218" r="22" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
<text class="sym" x="550" y="213" text-anchor="middle" fill="#14532d">Si</text>
<text class="pm" x="550" y="228" text-anchor="middle" fill="#16a34a">117 pm</text>

<!-- ── PERIOD 4 ── -->
<!-- K: 227 pm -->
<circle cx="170" cy="318" r="56" fill="#fef9c3" stroke="#ca8a04" stroke-width="0.8"/>
<text class="sym" x="170" y="313" text-anchor="middle" fill="#713f12">K</text>
<text class="pm" x="170" y="328" text-anchor="middle" fill="#ca8a04">227 pm</text>

<!-- Ca: 197 pm -->
<circle cx="310" cy="318" r="48" fill="#fef9c3" stroke="#ca8a04" stroke-width="0.8"/>
<text class="sym" x="310" y="313" text-anchor="middle" fill="#713f12">Ca</text>
<text class="pm" x="310" y="328" text-anchor="middle" fill="#ca8a04">197 pm</text>

<!-- Ga: 122 pm -->
<circle cx="430" cy="318" r="30" fill="#fef9c3" stroke="#ca8a04" stroke-width="0.8"/>
<text class="sym" x="430" y="313" text-anchor="middle" fill="#713f12">Ga</text>
<text class="pm" x="430" y="328" text-anchor="middle" fill="#ca8a04">122 pm</text>

<!-- Ge: 122 pm -->
<circle cx="550" cy="318" r="22" fill="#fef9c3" stroke="#ca8a04" stroke-width="0.8"/>
<text class="sym" x="550" y="313" text-anchor="middle" fill="#713f12">Ge</text>
<text class="pm" x="550" y="328" text-anchor="middle" fill="#ca8a04">122 pm</text>

<!-- Trend arrows: across period -->
<!-- Radius decreases → (red) -->
<line x1="218" y1="36" x2="528" y2="36" stroke="#e11d48" stroke-width="1.8" marker-end="url(#ard)"/>
<text class="ts" x="373" y="30" text-anchor="middle" fill="#e11d48">atomic radius decreases →</text>

<!-- IE increases → (blue, offset below) -->
<line x1="528" y1="46" x2="218" y2="46" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ari)"/>
<text class="ts" x="373" y="60" text-anchor="middle" fill="#2563eb">ionization energy increases →</text>

<!-- Trend arrows: down group -->
<!-- Radius increases ↓ (red) -->
<line x1="628" y1="80" x2="628" y2="302" stroke="#e11d48" stroke-width="1.8" marker-end="url(#ard)"/>
<text class="ts" x="646" y="195" text-anchor="middle" fill="#e11d48" transform="rotate(90,646,195)">atomic radius increases ↓</text>

<!-- IE decreases ↓ (blue) -->
<line x1="642" y1="302" x2="642" y2="80" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ari2)"/>
<text class="ts" x="660" y="195" text-anchor="middle" fill="#2563eb" transform="rotate(90,660,195)">ionization energy decreases ↓</text>
</svg>
