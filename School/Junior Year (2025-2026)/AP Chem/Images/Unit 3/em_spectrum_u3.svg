<svg viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg">
  <title>Electromagnetic Spectrum — AP Chem Unit 3</title>
  <desc>EM spectrum showing microwave, IR, visible, UV regions with molecular events, energy, and frequency ranges for AP Chemistry.</desc>
  <style>
    .th { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #1e293b; }
    .ts { font-family: Arial, sans-serif; font-size: 12px; fill: #334155; }
    .tss { font-family: Arial, sans-serif; font-size: 11px; fill: #475569; }
  </style>
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="310" fill="#f8fafc" rx="8"/>
  <text x="340" y="24" class="th" text-anchor="middle" font-size="15px">Electromagnetic Spectrum — Unit 3 AP Exam Reference</text>

  <!-- Spectrum blocks -->
  <rect x="15" y="38" width="100" height="55" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" rx="4"/>
  <text x="65" y="60" class="th" text-anchor="middle" fill="#4c1d95">Microwave</text>
  <text x="65" y="75" class="tss" text-anchor="middle">3×10⁹–</text>
  <text x="65" y="88" class="tss" text-anchor="middle">3×10¹¹ Hz</text>

  <rect x="120" y="38" width="130" height="55" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" rx="4"/>
  <text x="185" y="60" class="th" text-anchor="middle" fill="#92400e">Infrared (IR)</text>
  <text x="185" y="75" class="tss" text-anchor="middle">3×10¹¹–4×10¹⁴ Hz</text>
  <text x="185" y="88" class="tss" text-anchor="middle">2×10⁻²²–3×10⁻¹⁹ J</text>

  <rect x="255" y="38" width="145" height="55" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="4"/>
  <text x="327" y="60" class="th" text-anchor="middle" fill="#15803d">Visible Light</text>
  <text x="327" y="75" class="tss" text-anchor="middle">4–7.5×10¹⁴ Hz</text>
  <text x="327" y="88" class="tss" text-anchor="middle">3×10⁻¹⁹–5×10⁻¹⁹ J</text>

  <rect x="405" y="38" width="130" height="55" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" rx="4"/>
  <text x="470" y="60" class="th" text-anchor="middle" fill="#991b1b">Ultraviolet</text>
  <text x="470" y="75" class="tss" text-anchor="middle">7.5×10¹⁴–3×10¹⁶ Hz</text>
  <text x="470" y="88" class="tss" text-anchor="middle">5×10⁻¹⁹–2×10⁻¹⁷ J</text>

  <rect x="540" y="38" width="125" height="55" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
  <text x="602" y="60" class="th" text-anchor="middle" fill="#334155">X-ray / γ</text>
  <text x="602" y="75" class="tss" text-anchor="middle">&gt; 3×10¹⁶ Hz</text>
  <text x="602" y="88" class="tss" text-anchor="middle">highest energy</text>

  <!-- Energy arrow -->
  <line x1="15" y1="106" x2="660" y2="106" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="340" y="120" class="ts" text-anchor="middle" fill="#1d4ed8">E = hν → Energy and frequency increase →</text>

  <!-- Wavelength arrow (opposite) -->
  <line x1="660" y1="132" x2="15" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#arr3)"/>
  <text x="340" y="146" class="ts" text-anchor="middle" fill="#64748b">← Wavelength increases (λ = c/ν)</text>

  <!-- Molecular events table -->
  <rect x="10" y="158" width="660" height="145" fill="white" stroke="#e2e8f0" stroke-width="1" rx="5"/>
  <text x="340" y="178" class="th" text-anchor="middle">What Each Region Does to a Molecule</text>

  <rect x="20" y="185" width="150" height="50" fill="#ede9fe" rx="3"/>
  <text x="95" y="204" class="ts" text-anchor="middle" font-weight="bold" fill="#4c1d95">Microwave</text>
  <text x="95" y="220" class="tss" text-anchor="middle">Molecular rotation</text>
  <text x="95" y="233" class="tss" text-anchor="middle">(whole molecule spins)</text>

  <rect x="178" y="185" width="150" height="50" fill="#fef9c3" rx="3"/>
  <text x="253" y="204" class="ts" text-anchor="middle" font-weight="bold" fill="#92400e">Infrared</text>
  <text x="253" y="220" class="tss" text-anchor="middle">Bond vibration</text>
  <text x="253" y="233" class="tss" text-anchor="middle">(stretching + bending)</text>

  <rect x="336" y="185" width="155" height="50" fill="#dcfce7" rx="3"/>
  <text x="413" y="204" class="ts" text-anchor="middle" font-weight="bold" fill="#15803d">Visible / UV</text>
  <text x="413" y="220" class="tss" text-anchor="middle">Electronic transition</text>
  <text x="413" y="233" class="tss" text-anchor="middle">(e⁻ → higher energy level)</text>

  <rect x="499" y="185" width="162" height="50" fill="#fee2e2" rx="3"/>
  <text x="580" y="204" class="ts" text-anchor="middle" font-weight="bold" fill="#991b1b">High-energy UV / X-ray</text>
  <text x="580" y="220" class="tss" text-anchor="middle">Bond breaking</text>
  <text x="580" y="233" class="tss" text-anchor="middle">(photodissociation)</text>

  <!-- Key formulas -->
  <rect x="20" y="245" width="300" height="48" fill="#dbeafe" rx="4"/>
  <text x="170" y="263" class="th" text-anchor="middle" fill="#1d4ed8">Key Formulas</text>
  <text x="170" y="280" class="tss" text-anchor="middle">c = λν   (c = 3.00 × 10⁸ m/s)</text>
  <text x="170" y="295" class="tss" text-anchor="middle">E = hν   (h = 6.626 × 10⁻³⁴ J·s)</text>

  <!-- Visible bracket note -->
  <rect x="330" y="245" width="335" height="48" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="4"/>
  <text x="497" y="263" class="th" text-anchor="middle" fill="#15803d">Visible Energy Bracket (AP table trick)</text>
  <text x="497" y="280" class="tss" text-anchor="middle">Top of IR: 3×10⁻¹⁹ J   ↔   Bottom of UV: 5×10⁻¹⁹ J</text>
  <text x="497" y="295" class="tss" text-anchor="middle">Visible = between these. e.g. 4×10⁻¹⁹ J ✓</text>
</svg>
