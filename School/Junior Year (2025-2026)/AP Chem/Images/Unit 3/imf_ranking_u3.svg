<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <title>IMF Ranking and Comparison — AP Chem Unit 3</title>
  <desc>Visual ranking of London dispersion, dipole-dipole, hydrogen bonding, and ion-dipole forces with examples and relative strengths.</desc>
  <style>
    .th { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; }
    .ts { font-family: Arial, sans-serif; font-size: 12px; fill: #334155; }
    .tss { font-family: Arial, sans-serif; font-size: 11px; fill: #475569; }
    .label { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="400" fill="#f8fafc" rx="8"/>
  <text x="340" y="26" class="th" text-anchor="middle" font-size="15px">Intermolecular Forces — Ranking and Comparison</text>

  <!-- Strength arrow -->
  <line x1="30" y1="380" x2="650" y2="380" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arr)"/>
  <text x="340" y="395" class="ts" text-anchor="middle" fill="#1d4ed8">Increasing Strength →</text>

  <!-- LDF box -->
  <rect x="20" y="45" width="145" height="310" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
  <rect x="20" y="45" width="145" height="32" fill="#e2e8f0" rx="6"/>
  <text x="92" y="67" class="label" text-anchor="middle" fill="#475569">London Dispersion</text>
  <text x="92" y="92" class="tss" text-anchor="middle">Present in ALL molecules</text>
  <text x="92" y="107" class="tss" text-anchor="middle">Temporary dipoles</text>
  <text x="92" y="127" class="ts" text-anchor="middle" font-weight="bold">Increases with:</text>
  <text x="92" y="144" class="tss" text-anchor="middle">• More electrons</text>
  <text x="92" y="159" class="tss" text-anchor="middle">• Larger surface area</text>
  <text x="92" y="174" class="tss" text-anchor="middle">• Higher polarizability</text>
  <line x1="30" y1="188" x2="155" y2="188" stroke="#e2e8f0" stroke-width="1"/>
  <text x="92" y="205" class="tss" text-anchor="middle" font-style="italic">Only IMF in:</text>
  <text x="92" y="220" class="tss" text-anchor="middle">Noble gases (He, Ne)</text>
  <text x="92" y="235" class="tss" text-anchor="middle">N₂, O₂, CH₄, CCl₄</text>
  <text x="92" y="250" class="tss" text-anchor="middle">Hexane, pentane</text>
  <line x1="30" y1="265" x2="155" y2="265" stroke="#e2e8f0" stroke-width="1"/>
  <text x="92" y="282" class="tss" text-anchor="middle" fill="#991b1b">⚠ Can dominate if</text>
  <text x="92" y="297" class="tss" text-anchor="middle" fill="#991b1b">molecule is much larger</text>
  <text x="92" y="312" class="tss" text-anchor="middle" fill="#991b1b">than polar counterpart</text>
  <text x="92" y="330" class="tss" text-anchor="middle" fill="#991b1b">(CCl₄ > HCl at high T)</text>

  <!-- Dipole-Dipole box -->
  <rect x="175" y="45" width="145" height="310" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" rx="6"/>
  <rect x="175" y="45" width="145" height="32" fill="#fef08a" rx="6"/>
  <text x="247" y="67" class="label" text-anchor="middle" fill="#92400e">Dipole–Dipole</text>
  <text x="247" y="92" class="tss" text-anchor="middle">Between polar molecules</text>
  <text x="247" y="107" class="tss" text-anchor="middle">Permanent dipoles</text>
  <text x="247" y="127" class="ts" text-anchor="middle" font-weight="bold">Requires:</text>
  <text x="247" y="144" class="tss" text-anchor="middle">• Polar covalent bonds</text>
  <text x="247" y="159" class="tss" text-anchor="middle">• Net dipole moment</text>
  <text x="247" y="174" class="tss" text-anchor="middle">• δ+ end ↔ δ− end</text>
  <line x1="185" y1="188" x2="310" y2="188" stroke="#fef08a" stroke-width="1"/>
  <text x="247" y="205" class="tss" text-anchor="middle" font-style="italic">Examples:</text>
  <text x="247" y="220" class="tss" text-anchor="middle">HCl, SO₂, CHCl₃</text>
  <text x="247" y="235" class="tss" text-anchor="middle">Acetone, ester groups</text>
  <line x1="185" y1="250" x2="310" y2="250" stroke="#fef08a" stroke-width="1"/>
  <text x="247" y="267" class="tss" text-anchor="middle">Acts IN ADDITION to LDF</text>
  <text x="247" y="282" class="tss" text-anchor="middle">in polar molecules</text>

  <!-- H-bonding box -->
  <rect x="330" y="45" width="155" height="310" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="6"/>
  <rect x="330" y="45" width="155" height="32" fill="#bbf7d0" rx="6"/>
  <text x="407" y="67" class="label" text-anchor="middle" fill="#15803d">Hydrogen Bonding</text>
  <text x="407" y="92" class="tss" text-anchor="middle">Special dipole–dipole</text>
  <text x="407" y="107" class="tss" text-anchor="middle">H bonded to N, O, or F</text>
  <text x="407" y="127" class="ts" text-anchor="middle" font-weight="bold">Donor/Acceptor:</text>
  <text x="407" y="144" class="tss" text-anchor="middle">Donor: H–N, H–O, H–F</text>
  <text x="407" y="159" class="tss" text-anchor="middle">Acceptor: lone pair on N/O/F</text>
  <line x1="340" y1="173" x2="475" y2="173" stroke="#bbf7d0" stroke-width="1"/>
  <text x="407" y="190" class="tss" text-anchor="middle" font-style="italic">Examples:</text>
  <text x="407" y="205" class="tss" text-anchor="middle">H₂O, HF, NH₃, alcohols</text>
  <text x="407" y="220" class="tss" text-anchor="middle">Carboxylic acids, amines</text>
  <line x1="340" y1="234" x2="475" y2="234" stroke="#bbf7d0" stroke-width="1"/>
  <text x="407" y="252" class="tss" text-anchor="middle" fill="#15803d">Explains anomalous BP:</text>
  <text x="407" y="267" class="tss" text-anchor="middle" fill="#15803d">H₂O, HF, NH₃</text>
  <line x1="340" y1="282" x2="475" y2="282" stroke="#bbf7d0" stroke-width="1"/>
  <text x="407" y="299" class="tss" text-anchor="middle" fill="#991b1b">⚠ CH₃F: H on C, not F</text>
  <text x="407" y="314" class="tss" text-anchor="middle" fill="#991b1b">→ CANNOT H-bond</text>
  <text x="407" y="329" class="tss" text-anchor="middle" fill="#991b1b">NH₄⁺: no lone pair on N</text>
  <text x="407" y="344" class="tss" text-anchor="middle" fill="#991b1b">→ NO H-bond acceptor</text>

  <!-- Ion-Dipole box -->
  <rect x="495" y="45" width="170" height="310" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="6"/>
  <rect x="495" y="45" width="170" height="32" fill="#fecaca" rx="6"/>
  <text x="580" y="67" class="label" text-anchor="middle" fill="#991b1b">Ion–Dipole</text>
  <text x="580" y="92" class="tss" text-anchor="middle">Ion + polar molecule</text>
  <text x="580" y="107" class="tss" text-anchor="middle">Strongest type</text>
  <text x="580" y="127" class="ts" text-anchor="middle" font-weight="bold">Coulomb's Law:</text>
  <text x="580" y="144" class="tss" text-anchor="middle">F ∝ |q| / r²</text>
  <text x="580" y="159" class="tss" text-anchor="middle">Higher charge → stronger</text>
  <text x="580" y="174" class="tss" text-anchor="middle">Smaller radius → stronger</text>
  <line x1="505" y1="188" x2="655" y2="188" stroke="#fecaca" stroke-width="1"/>
  <text x="580" y="205" class="tss" text-anchor="middle" font-style="italic">Examples:</text>
  <text x="580" y="220" class="tss" text-anchor="middle">Na⁺/Cl⁻ in water</text>
  <text x="580" y="235" text-anchor="middle" class="tss">Mg²⁺ &gt; Ca²⁺ &gt; Na⁺ &gt; K⁺</text>
  <text x="580" y="250" class="tss" text-anchor="middle">(charge-to-size ratio)</text>
  <line x1="505" y1="265" x2="655" y2="265" stroke="#fecaca" stroke-width="1"/>
  <text x="580" y="282" class="tss" text-anchor="middle">Drives ionic dissolution</text>
  <text x="580" y="297" class="tss" text-anchor="middle">in polar solvents</text>
</svg>
