<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <style>
    text { font-family: serif; font-size: 12px; fill: #222; }
    .label { font-size: 11px; fill: #555; }
    .eq { font-size: 13px; fill: #15803d; font-style: italic; }
    .axis { stroke: #222; stroke-width: 1.5; }
    .grid { stroke: #ccc; stroke-width: 0.5; stroke-dasharray: 3,3; }
    .curve { fill: none; stroke: #15803d; stroke-width: 2.2; }
    .midline { fill: none; stroke: #15803d; stroke-width: 1; stroke-dasharray: 5,4; opacity: 0.5; }
    .tick { stroke: #222; stroke-width: 1; }
  </style>

  <!-- Midline at y=1 → pixel 120 (y=0 is at 160, amplitude 80px) -->
  <!-- y=2 → pixel 40, y=0 → pixel 200, y=1 midline → pixel 120 -->

  <!-- Grid -->
  <line class="grid" x1="50" y1="40" x2="480" y2="40"/>
  <line class="grid" x1="50" y1="120" x2="480" y2="120"/>
  <line class="grid" x1="50" y1="200" x2="480" y2="200"/>
  <line class="grid" x1="155" y1="10" x2="155" y2="225"/>
  <line class="grid" x1="260" y1="10" x2="260" y2="225"/>
  <line class="grid" x1="365" y1="10" x2="365" y2="225"/>
  <line class="grid" x1="470" y1="10" x2="470" y2="225"/>

  <!-- Axes (x-axis at y=0 → pixel 200) -->
  <line class="axis" x1="40" y1="200" x2="490" y2="200"/>
  <line class="axis" x1="50" y1="5" x2="50" y2="225"/>
  <polygon points="490,197 484,203 484,197" fill="#222"/>
  <polygon points="50,5 44,11 56,11" fill="#222"/>

  <!-- Midline (D=1) -->
  <line class="midline" x1="50" y1="120" x2="480" y2="120"/>
  <text class="label" x="5" y="124" fill="#15803d">D=1</text>

  <!-- Ticks -->
  <line class="tick" x1="155" y1="196" x2="155" y2="204"/>
  <line class="tick" x1="260" y1="196" x2="260" y2="204"/>
  <line class="tick" x1="365" y1="196" x2="365" y2="204"/>
  <line class="tick" x1="470" y1="196" x2="470" y2="204"/>
  <text class="label" x="143" y="216">-π</text>
  <text class="label" x="248" y="216">0</text>
  <text class="label" x="357" y="216">π</text>
  <text class="label" x="458" y="216">2π</text>

  <line class="tick" x1="46" y1="40" x2="54" y2="40"/>
  <line class="tick" x1="46" y1="120" x2="54" y2="120"/>
  <text class="label" x="30" y="44">2</text>
  <text class="label" x="30" y="124">1</text>
  <text class="label" x="30" y="204">0</text>

  <!-- sin(2x)+1: midline at pixel 120, amplitude 80px, period π = 105px -->
  <!-- peaks at x= π/4+kπ/2 offset from 0 (pixel 260) -->
  <!-- B=2 so period in pixels = 420*(π/4π) = 105px -->
  <!-- Over range -2π to 2π (pixels 50 to 470), 4 full periods -->
  <!-- Peaks (y=2, pixel 40): at -7π/4,-3π/4, π/4, 5π/4 → pixels ~107.5, ~212.5, ~287, ~392 approx -->
  <!-- Let's do it by computing: x_pixel = 50 + (x+2π)/(4π)*420 -->
  <!-- sin(2x)+1 zeros downward at x=-2π,-π,0,π,2π → pixels 50,155,260,365,470 -->
  <!-- peaks at x = -7π/4,-3π/4,π/4,5π/4 → 50+(0.25/4)*420≈50+26=76? Let me compute carefully -->
  <!-- x=-7π/4: (x+2π)=π/4 → pixel=50+(0.25/4)*420=50+26=76 ... peak (y=40) -->
  <!-- x=-5π/4: trough → 50+(0.75/4)*420=128 → y=200 -->
  <!-- x=-3π/4: peak → 50+(1.25/4)*420=181 → y=40 -->
  <!-- x=-π/4: trough → 50+(1.75/4)*420=234 → y=200 -->  
  <!-- x=π/4: peak → 50+(2.25/4)*420=286 → y=40 -->
  <!-- x=3π/4: trough → 50+(2.75/4)*420=338 → y=200 -->
  <!-- x=5π/4: peak → 50+(3.25/4)*420=391 → y=40 -->
  <!-- x=7π/4: trough → 50+(3.75/4)*420=444 → y=200 -->
  <path class="curve" d="
    M 50,120
    C 63,40 89,40 102,120
    C 115,200 141,200 155,120
    C 168,40 194,40 207,120
    C 220,200 246,200 260,120
    C 273,40 299,40 312,120
    C 325,200 351,200 365,120
    C 378,40 404,40 417,120
    C 430,200 456,200 470,120
  "/>

  <text class="eq" x="60" y="22">y = sin(2x) + 1</text>
  <text class="label" x="60" y="235">Amplitude = 1 | Period = π | Vertical shift: up 1</text>
</svg>
