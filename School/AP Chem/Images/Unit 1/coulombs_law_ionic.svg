<svg width="100%" viewBox="0 0 680 310" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Coulombs law comparison MgO vs NaCl ionic attraction</title>
<desc>Side by side comparison of MgO and NaCl ionic compounds. MgO has smaller ions with higher charges, producing stronger attraction and a melting point of 2852 degrees C. NaCl has larger ions with lower charges, weaker attraction, and melts at 801 degrees C.</desc>
<style>
  text { font-family: system-ui, -apple-system, sans-serif; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; }
  .tss { font-size: 11px; }
  .panel { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 0.8; }
</style>
<rect x="0" y="0" width="680" height="310" fill="#f8fafc" rx="8"/>
<defs>
  <marker id="attra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  </marker>
</defs>

<!-- Title + formula -->
<text class="th" x="340" y="26" text-anchor="middle" fill="#111">Coulomb's Law: Ionic Attraction Strength</text>
<text class="ts" x="340" y="44" text-anchor="middle" fill="#666">F &#x221D; (q&#x2081; &#xD7; q&#x2082;) / r&#xB2;   &#x2014;   higher charge, shorter distance = stronger force = higher melting point</text>

<!-- MgO Panel -->
<rect class="panel" x="40" y="58" width="278" height="220" rx="10"/>
<text class="th" x="179" y="80" text-anchor="middle" fill="#111">MgO</text>

<!-- Mg2+ circle — smaller, charge +2 -->
<circle cx="118" cy="168" r="30" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
<text class="th" x="118" y="163" text-anchor="middle" fill="#1d4ed8">Mg²⁺</text>
<text class="tss" x="118" y="178" text-anchor="middle" fill="#3b82f6">r = 72 pm</text>
<text class="tss" x="118" y="191" text-anchor="middle" fill="#3b82f6">charge +2</text>

<!-- O2- circle — medium, charge -2 -->
<circle cx="238" cy="168" r="38" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/>
<text class="th" x="238" y="163" text-anchor="middle" fill="#991b1b">O²⁻</text>
<text class="tss" x="238" y="178" text-anchor="middle" fill="#ef4444">r = 140 pm</text>
<text class="tss" x="238" y="191" text-anchor="middle" fill="#ef4444">charge −2</text>

<!-- Strong attraction arrows (thick) -->
<line x1="150" y1="160" x2="198" y2="160" stroke="#374151" stroke-width="2.5" marker-end="url(#attra)"/>
<line x1="198" y1="176" x2="150" y2="176" stroke="#374151" stroke-width="2.5" marker-end="url(#attra)"/>

<!-- MgO stats -->
<text class="tss" x="179" y="226" text-anchor="middle" fill="#555">charge product: 2 × 2 = <tspan font-weight="600">4</tspan></text>
<text class="tss" x="179" y="241" text-anchor="middle" fill="#555">distance: 72 + 140 = <tspan font-weight="600">212 pm</tspan></text>
<text class="th" x="179" y="262" text-anchor="middle" fill="#16a34a">Melting point: 2852°C</text>

<!-- NaCl Panel -->
<rect class="panel" x="362" y="58" width="278" height="220" rx="10"/>
<text class="th" x="501" y="80" text-anchor="middle" fill="#111">NaCl</text>

<!-- Na+ circle — larger, charge +1 -->
<circle cx="430" cy="168" r="42" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
<text class="th" x="430" y="163" text-anchor="middle" fill="#1d4ed8">Na⁺</text>
<text class="tss" x="430" y="178" text-anchor="middle" fill="#3b82f6">r = 102 pm</text>
<text class="tss" x="430" y="191" text-anchor="middle" fill="#3b82f6">charge +1</text>

<!-- Cl- circle — largest, charge -1 -->
<circle cx="572" cy="168" r="50" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/>
<text class="th" x="572" y="163" text-anchor="middle" fill="#991b1b">Cl⁻</text>
<text class="tss" x="572" y="178" text-anchor="middle" fill="#ef4444">r = 181 pm</text>
<text class="tss" x="572" y="191" text-anchor="middle" fill="#ef4444">charge −1</text>

<!-- Weak attraction arrows (thin) -->
<line x1="474" y1="160" x2="520" y2="160" stroke="#374151" stroke-width="1.2" marker-end="url(#attra)"/>
<line x1="520" y1="176" x2="474" y2="176" stroke="#374151" stroke-width="1.2" marker-end="url(#attra)"/>

<!-- NaCl stats -->
<text class="tss" x="501" y="226" text-anchor="middle" fill="#555">charge product: 1 × 1 = <tspan font-weight="600">1</tspan></text>
<text class="tss" x="501" y="241" text-anchor="middle" fill="#555">distance: 102 + 181 = <tspan font-weight="600">283 pm</tspan></text>
<text class="th" x="501" y="262" text-anchor="middle" fill="#d97706">Melting point: 801°C</text>

<!-- Conclusion bar -->
<rect x="40" y="288" width="600" height="18" rx="5" fill="none"/>
<text class="tss" x="340" y="301" text-anchor="middle" fill="#555">MgO: 4× larger charge product + 25% shorter distance → much stronger attraction → 3.5× higher melting point</text>
</svg>
