<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <title>Redox Overview — OIL RIG and Half-Reaction Method — AP Chem Unit 4</title>
  <style>
    .th  { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; }
    .ts  { font-family: Arial, sans-serif; font-size: 12px; fill: #334155; }
    .tss { font-family: Arial, sans-serif; font-size: 11px; fill: #475569; }
    .lbl { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; }
    .step{ font-family: Arial, sans-serif; font-size: 11px; fill: #1e293b; }
    .ex  { font-family: Arial, sans-serif; font-size: 10.5px; fill: #475569; font-style: italic; }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="400" fill="#f8fafc" rx="8"/>
  <text x="340" y="24" class="th" text-anchor="middle" font-size="15px">Redox Overview — OIL RIG and Half-Reaction Method</text>

  <!-- ── Left: OIL RIG ── -->
  <rect x="16" y="36" width="278" height="350" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
  <rect x="16" y="36" width="278" height="26" fill="#dbeafe" rx="6"/>
  <text x="155" y="54" class="lbl" text-anchor="middle" fill="#1d4ed8">OIL RIG — Core Concept</text>

  <!-- OIL box -->
  <rect x="28" y="68" width="122" height="84" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5" rx="4"/>
  <text x="89" y="88"  class="lbl" text-anchor="middle" fill="#92400e" font-size="22px">OIL</text>
  <text x="89" y="107" class="ts"  text-anchor="middle" fill="#92400e">Oxidation</text>
  <text x="89" y="123" class="ts"  text-anchor="middle" fill="#92400e">Is Loss</text>
  <text x="89" y="143" class="tss" text-anchor="middle" fill="#92400e">(of electrons)</text>

  <!-- RIG box -->
  <rect x="160" y="68" width="122" height="84" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5" rx="4"/>
  <text x="221" y="88"  class="lbl" text-anchor="middle" fill="#1d4ed8" font-size="22px">RIG</text>
  <text x="221" y="107" class="ts"  text-anchor="middle" fill="#1d4ed8">Reduction</text>
  <text x="221" y="123" class="ts"  text-anchor="middle" fill="#1d4ed8">Is Gain</text>
  <text x="221" y="143" class="tss" text-anchor="middle" fill="#1d4ed8">(of electrons)</text>

  <!-- ON change arrows -->
  <text x="155" y="172" class="lbl" text-anchor="middle">Oxidation number change:</text>
  <text x="155" y="190" class="ts" text-anchor="middle">ON increases → oxidized (OIL)</text>
  <text x="155" y="207" class="ts" text-anchor="middle">ON decreases → reduced (RIG)</text>

  <!-- Agent labels -->
  <line x1="26" y1="220" x2="287" y2="220" stroke="#cbd5e1" stroke-width="1"/>
  <text x="155" y="238" class="lbl" text-anchor="middle">Agent identification:</text>
  <rect x="28"  y="246" width="122" height="44" fill="#fef9c3" stroke="#fde68a" rx="3"/>
  <text x="89"  y="261" class="tss" text-anchor="middle" fill="#78350f">Reducing agent</text>
  <text x="89"  y="276" class="tss" text-anchor="middle" fill="#78350f">is itself oxidized</text>
  <text x="89"  y="286" class="tss" text-anchor="middle" fill="#78350f">(loses e⁻)</text>
  <rect x="160" y="246" width="122" height="44" fill="#eff6ff" stroke="#93c5fd" rx="3"/>
  <text x="221" y="261" class="tss" text-anchor="middle" fill="#1e3a8a">Oxidizing agent</text>
  <text x="221" y="276" class="tss" text-anchor="middle" fill="#1e3a8a">is itself reduced</text>
  <text x="221" y="286" class="tss" text-anchor="middle" fill="#1e3a8a">(gains e⁻)</text>

  <line x1="26" y1="300" x2="287" y2="300" stroke="#cbd5e1" stroke-width="1"/>
  <text x="155" y="317" class="ts" text-anchor="middle" font-weight="bold">H and O oxidation number traps:</text>
  <text x="155" y="333" class="tss" text-anchor="middle">O = −2 (except peroxides: −1; OF₂: +2)</text>
  <text x="155" y="349" class="tss" text-anchor="middle">H = +1 (except metal hydrides NaH: −1)</text>
  <text x="155" y="365" class="tss" text-anchor="middle">F = always −1 in all compounds</text>
  <text x="155" y="379" class="tss" text-anchor="middle">Elements in pure form: ON = 0</text>

  <!-- ── Right: Half-reaction method ── -->
  <rect x="310" y="36" width="352" height="350" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
  <rect x="310" y="36" width="352" height="26" fill="#dbeafe" rx="6"/>
  <text x="486" y="54" class="lbl" text-anchor="middle" fill="#1d4ed8">Half-Reaction Method (Acidic Solution)</text>

  <!-- Steps -->
  <rect x="322" y="68" width="328" height="30" fill="#eff6ff" stroke="#bfdbfe" rx="3"/>
  <text x="338" y="87" class="step" font-weight="bold">Step 1</text>
  <text x="378" y="87" class="step">Split into oxidation and reduction half-reactions.</text>

  <rect x="322" y="104" width="328" height="30" fill="#eff6ff" stroke="#bfdbfe" rx="3"/>
  <text x="338" y="123" class="step" font-weight="bold">Step 2</text>
  <text x="378" y="123" class="step">Balance all atoms except O and H.</text>

  <rect x="322" y="140" width="328" height="30" fill="#eff6ff" stroke="#bfdbfe" rx="3"/>
  <text x="338" y="159" class="step" font-weight="bold">Step 3</text>
  <text x="378" y="159" class="step">Balance O: add H₂O to the oxygen-deficient side.</text>

  <rect x="322" y="176" width="328" height="30" fill="#eff6ff" stroke="#bfdbfe" rx="3"/>
  <text x="338" y="195" class="step" font-weight="bold">Step 4</text>
  <text x="378" y="195" class="step">Balance H: add H⁺ to the hydrogen-deficient side.</text>

  <rect x="322" y="212" width="328" height="30" fill="#eff6ff" stroke="#bfdbfe" rx="3"/>
  <text x="338" y="231" class="step" font-weight="bold">Step 5</text>
  <text x="378" y="231" class="step">Balance charge: add e⁻ to the more positive side.</text>

  <rect x="322" y="248" width="328" height="38" fill="#fef3c7" stroke="#fde68a" rx="3"/>
  <text x="338" y="265" class="step" font-weight="bold">Step 6</text>
  <text x="378" y="265" class="step">Multiply each half-reaction by LCM factor so</text>
  <text x="378" y="279" class="step">electrons cancel between the two half-reactions.</text>

  <rect x="322" y="292" width="328" height="38" fill="#f0fdf4" stroke="#86efac" rx="3"/>
  <text x="338" y="309" class="step" font-weight="bold">Step 7</text>
  <text x="378" y="309" class="step">Add half-reactions. Cancel e⁻, H₂O, H⁺</text>
  <text x="378" y="323" class="step">that appear on both sides.</text>

  <rect x="322" y="336" width="328" height="30" fill="#fdf4ff" stroke="#e9d5ff" rx="3"/>
  <text x="338" y="355" class="step" font-weight="bold">Step 8</text>
  <text x="378" y="355" class="step">Verify: all atoms balanced, all charges balanced, no e⁻ remain.</text>

  <!-- Basic solution note -->
  <rect x="322" y="372" width="328" height="10" fill="#fef2f2" rx="2"/>
  <text x="486" y="380" class="tss" text-anchor="middle" fill="#dc2626">Basic solution: complete steps 1–7 acidically, then add OH⁻ to both sides to neutralize all H⁺.</text>
</svg>
