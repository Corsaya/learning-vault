<svg viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg">
  <title>Exothermic and Endothermic Energy Diagrams</title>
  <desc>Side-by-side reaction coordinate diagrams comparing exothermic and endothermic energy profiles, showing activation energy, transition state, and ΔH for each.</desc>
  <style>
    .th { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; }
    .ts { font-family: Arial, sans-serif; font-size: 12px; fill: #334155; }
    .tss { font-family: Arial, sans-serif; font-size: 11px; fill: #475569; }
    .label-red { font-family: Arial, sans-serif; font-size: 11px; fill: #991b1b; font-weight: bold; }
    .label-blue { font-family: Arial, sans-serif; font-size: 11px; fill: #1d4ed8; font-weight: bold; }
    .label-green { font-family: Arial, sans-serif; font-size: 11px; fill: #15803d; font-weight: bold; }
  </style>
  <defs>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1e293b"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowBl" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background panels -->
  <rect x="8" y="8" width="320" height="296" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="352" y="8" width="320" height="296" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- LEFT PANEL: Exothermic (ΔH < 0) -->
  <text x="168" y="28" class="th" text-anchor="middle" fill="#991b1b">EXOTHERMIC  (ΔH &lt; 0)</text>

  <!-- Axes -->
  <line x1="35" y1="270" x2="310" y2="270" stroke="#555" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <line x1="35" y1="270" x2="35" y2="38" stroke="#555" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <text x="172" y="290" class="tss" text-anchor="middle">Reaction Progress →</text>
  <text x="18" y="155" class="tss" text-anchor="middle" transform="rotate(-90,18,155)">Potential Energy</text>

  <!-- Reactants level line: y=170, x=42 to 82 -->
  <line x1="42" y1="170" x2="88" y2="170" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="58" y="185" class="label-blue">Reactants</text>

  <!-- Products level line: y=220, x=250 to 302 -->
  <line x1="250" y1="220" x2="302" y2="220" stroke="#16a34a" stroke-width="2.5"/>
  <text x="255" y="237" class="label-green">Products</text>

  <!-- Reaction coordinate curve (exothermic: products lower than reactants) -->
  <path d="M 42,170 L 88,170 C 115,170 125,58 168,58 C 211,58 222,220 250,220 L 302,220"
        stroke="#334155" stroke-width="2" fill="none"/>

  <!-- Transition state label -->
  <text x="168" y="50" class="tss" text-anchor="middle">Transition State</text>
  <text x="168" y="63" class="tss" text-anchor="middle">(Activated Complex)</text>

  <!-- Ea(forward) arrow: from reactants level to TS peak -->
  <line x1="105" y1="170" x2="105" y2="62" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowR)"/>
  <text x="108" y="120" class="label-red">Ea</text>
  <text x="108" y="131" class="label-red">(fwd)</text>

  <!-- Ea(reverse) arrow: from products level to TS peak -->
  <line x1="232" y1="220" x2="232" y2="62" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowBl)"/>
  <text x="236" y="145" class="tss" fill="#4c1d95" font-weight="bold">Ea</text>
  <text x="236" y="156" class="tss" fill="#4c1d95" font-weight="bold">(rev)</text>

  <!-- ΔH arrow: from reactants level (y=170) to products (y=220), pointing DOWN -->
  <line x1="300" y1="170" x2="300" y2="218" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowR)"/>
  <line x1="291" y1="170" x2="309" y2="170" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="291" y1="220" x2="309" y2="220" stroke="#16a34a" stroke-width="1.5"/>
  <text x="312" y="200" class="label-red">ΔH &lt; 0</text>

  <!-- Catalyst note -->
  <text x="140" y="82" class="tss" fill="#7c3aed">↓ Ea with catalyst</text>
  <text x="140" y="93" class="tss" fill="#7c3aed">(ΔH unchanged)</text>

  <!-- RIGHT PANEL: Endothermic (ΔH > 0) -->
  <text x="512" y="28" class="th" text-anchor="middle" fill="#1d4ed8">ENDOTHERMIC  (ΔH &gt; 0)</text>

  <!-- Axes -->
  <line x1="378" y1="270" x2="654" y2="270" stroke="#555" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <line x1="378" y1="270" x2="378" y2="38" stroke="#555" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <text x="516" y="290" class="tss" text-anchor="middle">Reaction Progress →</text>

  <!-- Reactants level line: y=220, x=385 to 430 -->
  <line x1="385" y1="220" x2="432" y2="220" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="385" y="237" class="label-blue">Reactants</text>

  <!-- Products level line: y=165, x=596 to 645 -->
  <line x1="594" y1="165" x2="645" y2="165" stroke="#16a34a" stroke-width="2.5"/>
  <text x="590" y="155" class="label-green">Products</text>

  <!-- Reaction coordinate curve (endothermic: products higher than reactants) -->
  <path d="M 385,220 L 432,220 C 462,220 472,58 512,58 C 552,58 562,165 594,165 L 645,165"
        stroke="#334155" stroke-width="2" fill="none"/>

  <!-- Transition state label -->
  <text x="512" y="50" class="tss" text-anchor="middle">Transition State</text>
  <text x="512" y="63" class="tss" text-anchor="middle">(Activated Complex)</text>

  <!-- Ea(forward) arrow: from reactants (y=220) to TS (y=58) -->
  <line x1="450" y1="220" x2="450" y2="62" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowR)"/>
  <text x="453" y="145" class="label-red">Ea</text>
  <text x="453" y="156" class="label-red">(fwd)</text>

  <!-- Ea(reverse) arrow: from products (y=165) to TS (y=58) -->
  <line x1="575" y1="165" x2="575" y2="62" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowBl)"/>
  <text x="578" y="117" class="tss" fill="#4c1d95" font-weight="bold">Ea</text>
  <text x="578" y="128" class="tss" fill="#4c1d95" font-weight="bold">(rev)</text>

  <!-- ΔH arrow: from reactants level (y=220) to products (y=165), pointing UP -->
  <line x1="644" y1="220" x2="644" y2="168" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBl)"/>
  <line x1="635" y1="220" x2="653" y2="220" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="635" y1="165" x2="653" y2="165" stroke="#16a34a" stroke-width="1.5"/>
  <text x="649" y="198" class="label-blue">ΔH &gt; 0</text>

  <!-- Note: Ea(fwd) = Ea(rev) + |ΔH| for endo -->
  <text x="392" y="83" class="tss" fill="#475569">Ea(fwd) = Ea(rev) + ΔH</text>
  <text x="392" y="94" class="tss" fill="#475569">(endo: rev has smaller Ea)</text>

</svg>
