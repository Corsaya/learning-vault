<svg viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
  <title>Ionic Lattice Structure</title>
  <desc>Comparison of stable vs unstable ionic arrangements showing alternating charges maximize attraction and minimize repulsion.</desc>
  <style>
    .th { font-family: Georgia, serif; font-size: 14px; font-weight: bold; fill: #1e293b; }
    .ts { font-family: Georgia, serif; font-size: 12px; fill: #334155; }
    .tss { font-family: Georgia, serif; font-size: 11px; fill: #64748b; }
    .label { font-family: Georgia, serif; font-size: 13px; font-weight: bold; }
  </style>
  <rect x="0" y="0" width="680" height="340" fill="#f8fafc" rx="8"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="26" text-anchor="middle" class="th" font-size="15">Ionic Lattice Structure: Stable vs. Unstable Arrangements</text>

  <!-- LEFT PANEL: Stable -->
  <rect x="20" y="40" width="300" height="280" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="170" y="62" text-anchor="middle" class="label" fill="#15803d">✓ STABLE — Alternating Charges</text>
  <text x="170" y="78" text-anchor="middle" class="tss">Every + surrounded by −, every − surrounded by +</text>

  <!-- Stable lattice grid: 4x4 alternating -->
  <!-- Row 1 -->
  <circle cx="75"  cy="110" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="75"  cy="110" text-anchor="middle" dominant-baseline="central" class="th" fill="#1d4ed8" y="110">+</text>
  <circle cx="135" cy="110" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="135" cy="110" text-anchor="middle" dominant-baseline="central" class="th" fill="#991b1b" y="110">−</text>
  <circle cx="195" cy="110" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="195" cy="110" text-anchor="middle" dominant-baseline="central" class="th" fill="#1d4ed8" y="110">+</text>
  <circle cx="255" cy="110" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="255" cy="110" text-anchor="middle" dominant-baseline="central" class="th" fill="#991b1b" y="110">−</text>
  <!-- Row 2 -->
  <circle cx="75"  cy="170" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="75"  cy="170" text-anchor="middle" dominant-baseline="central" class="th" fill="#991b1b" y="170">−</text>
  <circle cx="135" cy="170" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="135" cy="170" text-anchor="middle" dominant-baseline="central" class="th" fill="#1d4ed8" y="170">+</text>
  <circle cx="195" cy="170" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="195" cy="170" text-anchor="middle" dominant-baseline="central" class="th" fill="#991b1b" y="170">−</text>
  <circle cx="255" cy="170" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="255" cy="170" text-anchor="middle" dominant-baseline="central" class="th" fill="#1d4ed8" y="170">+</text>
  <!-- Row 3 -->
  <circle cx="75"  cy="230" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="75"  cy="230" text-anchor="middle" dominant-baseline="central" class="th" fill="#1d4ed8" y="230">+</text>
  <circle cx="135" cy="230" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="135" cy="230" text-anchor="middle" dominant-baseline="central" class="th" fill="#991b1b" y="230">−</text>
  <circle cx="195" cy="230" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="195" cy="230" text-anchor="middle" dominant-baseline="central" class="th" fill="#1d4ed8" y="230">+</text>
  <circle cx="255" cy="230" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="255" cy="230" text-anchor="middle" dominant-baseline="central" class="th" fill="#991b1b" y="230">−</text>

  <text x="170" y="276" text-anchor="middle" class="ts" fill="#15803d">Max attraction (+/− neighbors)</text>
  <text x="170" y="294" text-anchor="middle" class="ts" fill="#15803d">Min repulsion (no +/+ or −/− adjacent)</text>
  <text x="170" y="312" text-anchor="middle" class="tss">e.g., NaCl, KI crystal structure</text>

  <!-- RIGHT PANEL: Unstable -->
  <rect x="360" y="40" width="300" height="280" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="510" y="62" text-anchor="middle" class="label" fill="#991b1b">✗ UNSTABLE — Like Charges Adjacent</text>
  <text x="510" y="78" text-anchor="middle" class="tss">Same charges neighboring each other → strong repulsion</text>

  <!-- Unstable: like charges grouped -->
  <!-- Row 1: all + -->
  <circle cx="415" cy="110" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="415" cy="110" text-anchor="middle" dominant-baseline="central" class="th" fill="#1d4ed8" y="110">+</text>
  <circle cx="475" cy="110" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="475" cy="110" text-anchor="middle" dominant-baseline="central" class="th" fill="#1d4ed8" y="110">+</text>
  <circle cx="535" cy="110" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="535" cy="110" text-anchor="middle" dominant-baseline="central" class="th" fill="#1d4ed8" y="110">+</text>
  <circle cx="595" cy="110" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="595" cy="110" text-anchor="middle" dominant-baseline="central" class="th" fill="#1d4ed8" y="110">+</text>
  <!-- Row 2: all − -->
  <circle cx="415" cy="170" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="415" cy="170" text-anchor="middle" dominant-baseline="central" class="th" fill="#991b1b" y="170">−</text>
  <circle cx="475" cy="170" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="475" cy="170" text-anchor="middle" dominant-baseline="central" class="th" fill="#991b1b" y="170">−</text>
  <circle cx="535" cy="170" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="535" cy="170" text-anchor="middle" dominant-baseline="central" class="th" fill="#991b1b" y="170">−</text>
  <circle cx="595" cy="170" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="595" cy="170" text-anchor="middle" dominant-baseline="central" class="th" fill="#991b1b" y="170">−</text>
  <!-- Row 3: all + -->
  <circle cx="415" cy="230" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="415" cy="230" text-anchor="middle" dominant-baseline="central" class="th" fill="#1d4ed8" y="230">+</text>
  <circle cx="475" cy="230" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="475" cy="230" text-anchor="middle" dominant-baseline="central" class="th" fill="#1d4ed8" y="230">+</text>
  <circle cx="535" cy="230" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="535" cy="230" text-anchor="middle" dominant-baseline="central" class="th" fill="#1d4ed8" y="230">+</text>
  <circle cx="595" cy="230" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="595" cy="230" text-anchor="middle" dominant-baseline="central" class="th" fill="#1d4ed8" y="230">+</text>

  <!-- Repulsion arrows between + ions in row 1 -->
  <line x1="440" y1="104" x2="450" y2="104" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="104" x2="440" y2="104" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="104" x2="510" y2="104" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="104" x2="500" y2="104" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="104" x2="570" y2="104" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="104" x2="560" y2="104" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="510" y="276" text-anchor="middle" class="ts" fill="#991b1b">Like-charge neighbors repel strongly</text>
  <text x="510" y="294" text-anchor="middle" class="ts" fill="#991b1b">Highly unstable — not a real ionic lattice</text>
</svg>
