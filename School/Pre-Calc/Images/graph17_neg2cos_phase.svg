<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <style>
    text { font-family: serif; font-size: 12px; fill: #222; }
    .label { font-size: 11px; fill: #555; }
    .eq { font-size: 13px; fill: #0369a1; font-style: italic; }
    .axis { stroke: #222; stroke-width: 1.5; }
    .grid { stroke: #ccc; stroke-width: 0.5; stroke-dasharray: 3,3; }
    .curve { fill: none; stroke: #0369a1; stroke-width: 2.2; }
    .tick { stroke: #222; stroke-width: 1; }
  </style>

  <!-- y=2→pixel 30, y=0→pixel 130, y=-2→pixel 230. Scale: 50px per unit -->
  <!-- x: -2π=50, -π=155, 0=260, π=365, 2π=470 -->

  <!-- Grid -->
  <line class="grid" x1="50" y1="30" x2="480" y2="30"/>
  <line class="grid" x1="50" y1="130" x2="480" y2="130"/>
  <line class="grid" x1="50" y1="230" x2="480" y2="230"/>
  <line class="grid" x1="155" y1="10" x2="155" y2="235"/>
  <line class="grid" x1="260" y1="10" x2="260" y2="235"/>
  <line class="grid" x1="365" y1="10" x2="365" y2="235"/>
  <line class="grid" x1="470" y1="10" x2="470" y2="235"/>

  <!-- Axes -->
  <line class="axis" x1="40" y1="130" x2="490" y2="130"/>
  <line class="axis" x1="50" y1="5" x2="50" y2="238"/>
  <polygon points="490,127 484,133 484,127" fill="#222"/>
  <polygon points="50,5 44,11 56,11" fill="#222"/>

  <!-- Ticks -->
  <line class="tick" x1="155" y1="126" x2="155" y2="134"/>
  <line class="tick" x1="260" y1="126" x2="260" y2="134"/>
  <line class="tick" x1="365" y1="126" x2="365" y2="134"/>
  <line class="tick" x1="470" y1="126" x2="470" y2="134"/>
  <text class="label" x="143" y="146">-π</text>
  <text class="label" x="248" y="146">0</text>
  <text class="label" x="357" y="146">π</text>
  <text class="label" x="458" y="146">2π</text>

  <line class="tick" x1="46" y1="30" x2="54" y2="30"/>
  <line class="tick" x1="46" y1="230" x2="54" y2="230"/>
  <text class="label" x="30" y="34">2</text>
  <text class="label" x="25" y="234">-2</text>

  <!-- -2cos(x+π) = 2cos x: peaks at 0,±2π; troughs at ±π -->
  <!-- peak at pixel (260,30), trough at pixel (155,230) and (365,230) -->
  <path class="curve" d="
    M 50,130
    C 76,230 129,230 155,130
    C 181,30 234,30 260,130
    C 286,230 339,230 365,130
    C 391,30 444,30 470,130
  "/>

  <!-- Simplification note -->
  <text class="label" x="140" y="22" fill="#0369a1">= 2cos x  (phase shift + reflection cancel)</text>

  <text class="eq" x="60" y="22">y = -2cos(x+π)</text>
  <text class="label" x="60" y="238">Amplitude = 2 | Period = 2π | Equivalent to 2cos x</text>
</svg>
