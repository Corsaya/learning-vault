<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAT Practice 11 — Miss Review</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#14181f;--muted:#6b7280;--line:#e3e6ea;
  --accent:#2f5fd0;--good:#137a45;--warn:#a5620a;--bad:#b3261e;--shadow:0 1px 3px rgba(0,0,0,.09)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1216;--panel:#171b21;--ink:#e8eaed;--muted:#98a1ae;--line:#282e37;
  --accent:#7aa2f7;--good:#4ac585;--warn:#e0a34a;--bad:#f2827a;--shadow:0 1px 3px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0f1216;--panel:#171b21;--ink:#e8eaed;--muted:#98a1ae;
  --line:#282e37;--accent:#7aa2f7;--good:#4ac585;--warn:#e0a34a;--bad:#f2827a;--shadow:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.pill.blind{color:var(--bad);border-color:var(--bad);font-weight:650}
.bar{flex:1;min-width:110px;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#s2.on{background:var(--bad);border-color:var(--bad)}
#s3.on{background:var(--warn);border-color:var(--warn)}
#s1.on{background:var(--good);border-color:var(--good)}
main{max-width:1180px;margin:0 auto;padding:14px 16px 0}
.qbar{display:flex;gap:9px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.qid{font-weight:650;font-size:16px}
.typ{font-size:13px;color:var(--muted)}
.note{background:color-mix(in srgb,var(--accent) 7%,var(--panel));border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:8px;padding:8px 11px;font-size:13.5px;margin-bottom:9px}
.shotwrap{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  box-shadow:var(--shadow);overflow:auto;max-height:52vh;display:flex;justify-content:center}
.shot{max-width:100%;height:auto;display:block}
.form{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:10px 16px 12px;margin-top:12px;box-shadow:0 -1px 3px rgba(0,0,0,.08)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.lab{font-size:12px;color:var(--muted);min-width:92px;font-weight:650}
.row input[type=text]{flex:1;min-width:260px;font:13.5px/1.4 inherit;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.row input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px}
.k{font-size:10px;opacity:.65;margin-left:5px}
.nav{margin-left:auto;display:flex;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:4px;margin:10px 0 4px}
.cell{aspect-ratio:1.5;border-radius:6px;border:1px solid var(--line);background:var(--panel);
  font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;padding:0;gap:1px}
.cell:hover{border-color:var(--accent)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.cell .n{font-weight:650}
.cell .v{font-size:10px}
.cell.s1{background:color-mix(in srgb,var(--good) 16%,var(--panel))}
.cell.s2{background:color-mix(in srgb,var(--bad) 18%,var(--panel))}
.cell.s3{background:color-mix(in srgb,var(--warn) 18%,var(--panel))}
.cell.blind .n{color:var(--bad)}
.sec-h{font-size:12px;color:var(--muted);margin:12px 0 2px;font-weight:650;letter-spacing:.04em;text-transform:uppercase}
.hint{font-size:12px;color:var(--muted);margin:6px 0 12px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);
  max-width:860px;width:94%;padding:0}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dlg-b{padding:14px 16px}
textarea{width:100%;height:340px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
</style></head><body>
<header>
  <h1>SAT Practice 11 — Miss Review</h1>
  <span class="pill" id="count"></span>
  <div class="bar"><i id="prog"></i></div>
  <button id="only">Show: all 27</button>
  <button id="exp">Export for Claude</button>
</header>
<main>
  <div class="qbar">
    <span class="qid" id="qid"></span>
    <span class="typ" id="typ"></span>
    <span class="pill" id="conf"></span>
    <span class="pill blind" id="bs" style="display:none">blind spot</span>
    <span class="pill" id="pos"></span>
  </div>
  <div class="note" id="note"></div>
  <div class="shotwrap" id="shotwrap"><img class="shot" id="shot" alt=""></div>
  <div class="sec-h">All 27 misses</div>
  <div class="grid" id="grid"></div>
  <p class="hint">Read the College Board rationale on the right of each screenshot first, then triage.
  Keys: <b>1</b> get it &middot; <b>2</b> still lost (jumps to the note box) &middot; <b>3</b> careless &middot; <b>Enter</b> next &middot; <b>←/→</b> move.</p>
</main>
<div class="form">
  <div class="row"><span class="lab">Verdict</span>
    <button id="s1">1 — I get it now<span class="k">1</span></button>
    <button id="s2">2 — Still don't understand<span class="k">2</span></button>
    <button id="s3">3 — Careless, I knew this<span class="k">3</span></button>
  </div>
  <div class="row"><span class="lab">What to ask</span>
    <input type="text" id="inp" placeholder="Optional — what specifically is confusing, or what you did instead">
    <span class="nav"><button id="prev">← Prev</button><button id="next">Next →</button></span>
  </div>
</div>
<dialog id="dlg">
  <div class="dlg-h"><b>Paste this to Claude</b><span class="pill" id="expcount"></span>
    <button id="copy" style="margin-left:auto">Copy</button>
    <button id="dl">Download .md</button><button id="close">Close</button></div>
  <div class="dlg-b"><textarea id="out" readonly></textarea></div>
</dialog>
<script>
const M = [{"file":"Screenshot_20260820_162304.png","sec":"R&W","mod":1,"q":3,"dom":"Craft and Structure","typ":"Word in context","note":"Sentence announces a paradox, so the blank needs a negative word (hampered). 'Reflected' is neutral and fits the topic, not the logic.","c":3},{"file":"Screenshot_20260820_162523.png","sec":"R&W","mod":1,"q":6,"dom":"Craft and Structure","typ":"Function of underlined portion","note":"Asks what the underlined sentence DOES for the text as a whole, not what it says.","c":2},{"file":"Screenshot_20260820_162657.png","sec":"R&W","mod":1,"q":7,"dom":"Craft and Structure","typ":"Cross-text connections","note":"How would Text 2's critics respond to Text 1's underlined claim. Find each author's position first, then the relationship.","c":2},{"file":"Screenshot_20260820_162712.png","sec":"R&W","mod":1,"q":8,"dom":"Information and Ideas","typ":"Inference, literary","note":"What would Lady Howard agree with about Villars \u2014 supported by the letter, not implied by tone.","c":3},{"file":"Screenshot_20260820_162752.png","sec":"R&W","mod":1,"q":12,"dom":"Information and Ideas","typ":"Quotation illustrating a claim","note":"The claim is about audience-mediated slapstick comedy. The right quote must show THAT, not just mention the company.","c":2},{"file":"Screenshot_20260820_162754.png","sec":"R&W","mod":1,"q":13,"dom":"Information and Ideas","typ":"Table data","note":"Fiber diameters. Wrong options quote real numbers supporting the wrong comparison.","c":3},{"file":"Screenshot_20260820_162805.png","sec":"R&W","mod":1,"q":19,"dom":"Standard English Conventions","typ":"Matched dash pair","note":"An em dash already opened the interrupter before the blank, so it must close with a dash, not a colon.","c":3},{"file":"Screenshot_20260820_162815.png","sec":"R&W","mod":1,"q":23,"dom":"Expression of Ideas","typ":"Transition","note":"BLIND SPOT \u2014 rated 4. Census data complicates the popular narrative; the blank needs contrast.","c":4},{"file":"Screenshot_20260820_162837.png","sec":"R&W","mod":2,"q":2,"dom":"Craft and Structure","typ":"Word in context","note":"'Ubiquity' \u2014 the sentence needs widespread availability, matching the second half.","c":3},{"file":"Screenshot_20260820_162838.png","sec":"R&W","mod":2,"q":3,"dom":"Craft and Structure","typ":"Word in context","note":"'Reciprocity' \u2014 pairs foster each other's cygnets; mutual exchange, not cohesion.","c":2},{"file":"Screenshot_20260820_162839.png","sec":"R&W","mod":2,"q":4,"dom":"Craft and Structure","typ":"Word in context","note":"'Manifest' here means perceptible, not realized. Older sense, not the everyday one.","c":2},{"file":"Screenshot_20260820_162840.png","sec":"R&W","mod":2,"q":5,"dom":"Craft and Structure","typ":"Main purpose","note":"What the passage as a whole is DOING, not its subject.","c":3},{"file":"Screenshot_20260820_162844.png","sec":"R&W","mod":2,"q":9,"dom":"Information and Ideas","typ":"Main idea","note":"Spike waves exceed the steepness constraint \u2014 the finding, not the background.","c":3},{"file":"Screenshot_20260820_162847.png","sec":"R&W","mod":2,"q":12,"dom":"Information and Ideas","typ":"Table data","note":"BLIND SPOT \u2014 rated 5. TRAPPIST-1: rotational period equals orbital period, so read the row for the named planet.","c":5},{"file":"Screenshot_20260820_162849.png","sec":"R&W","mod":2,"q":14,"dom":"Information and Ideas","typ":"Logical completion","note":"Model uses one uniform value where reality varies, so disagreements are expected.","c":1},{"file":"Screenshot_20260820_162855.png","sec":"R&W","mod":2,"q":20,"dom":"Standard English Conventions","typ":"Finite verb vs participle","note":"'Slept' is already the main verb, so the blank takes a participle (prioritizing).","c":3},{"file":"Screenshot_20260820_162856.png","sec":"R&W","mod":2,"q":21,"dom":"Standard English Conventions","typ":"Finite verb vs participle","note":"'Adapted' is the main verb, so the blank takes a participle (searching).","c":3},{"file":"Screenshot_20260820_162858.png","sec":"R&W","mod":2,"q":23,"dom":"Expression of Ideas","typ":"Transition","note":"BLIND SPOT \u2014 rated 4. Migrants relocated within the region, contradicting the California narrative.","c":4},{"file":"Screenshot_20260820_162922.png","sec":"Math","mod":1,"q":19,"dom":"Algebra","typ":"Read a graph intercept","note":"Mass per M-type star = total / x-intercept. You eyeballed the gridlines by hand; retype the line in Desmos and click the intercept.","c":2},{"file":"Screenshot_20260820_162923.png","sec":"Math","mod":1,"q":20,"dom":"Geometry and Trigonometry","typ":"SOH-CAH-TOA","note":"SR=18 is opposite angle Q, QS is the hypotenuse, so QS = 18/sin Q. You backsolved with Desmos open; the tool can't fix a mislabeled side.","c":2},{"file":"Screenshot_20260820_162938-1.png","sec":"Math","mod":2,"q":12,"dom":"Problem-Solving and Data Analysis","typ":"Probability, compound condition","note":"BLIND SPOT \u2014 rated 5. Even AND <=50 is 25 of 160 = 5/32. You counted all <=50.","c":5},{"file":"Screenshot_20260820_162940-1.png","sec":"Math","mod":2,"q":15,"dom":"Advanced Math","typ":"Rational exponents (SPR)","note":"Method was right the whole way; final division used 9 instead of 81. Careless, not conceptual.","c":3},{"file":"Screenshot_20260820_162941.png","sec":"Math","mod":2,"q":16,"dom":"Advanced Math","typ":"Rational function","note":"g(-22)=0 means the NUMERATOR is zero there, so a=506; g(0)=a/b=22 gives b=23.","c":1},{"file":"Screenshot_20260820_162942.png","sec":"Math","mod":2,"q":17,"dom":"Geometry and Trigonometry","typ":"Angles at an intersection","note":"Two lines make pairs summing to 180 or to twice one angle. You graphed it \u2014 graphing can't answer 'could NOT be'.","c":2},{"file":"Screenshot_20260820_162943-1.png","sec":"Math","mod":2,"q":19,"dom":"Algebra","typ":"System, 'at least one solution'","note":"BLIND SPOT \u2014 rated 4, and you GRAPHED it. The two equations are the same line, so Desmos draws one line = infinitely many solutions = 'at least one'.","c":4},{"file":"Screenshot_20260820_162945.png","sec":"Math","mod":2,"q":21,"dom":"Advanced Math","typ":"Factored form from a graph","note":"Bounce = squared factor, cross = single factor. Read roots off the graph and apply the x+28 shift.","c":1},{"file":"Screenshot_20260820_162947.png","sec":"Math","mod":2,"q":22,"dom":"Problem-Solving and Data Analysis","typ":"Chained percents (SPR)","note":"A=4.68b and A=0.00780c, so c=600b, so p=60000. Desmos solves it in one line.","c":1}];
const KEY="sat-p11-review";
let V = JSON.parse(localStorage.getItem(KEY) || "{}");
let cur = 0, onlyOpen = false;
const $ = id => document.getElementById(id);
const save = () => localStorage.setItem(KEY, JSON.stringify(V));
const rec = i => (V[i] = V[i] || {});
const pool = () => M.map((m,i)=>i).filter(i => !onlyOpen || !(V[i]||{}).s);
const tag = m => m.sec + " M" + m.mod + " Q" + m.q;

$("grid").innerHTML = M.map((m,i) =>
  `<button class="cell ${m.note.includes("BLIND SPOT")?"blind":""}" data-i="${i}">
     <span class="n">${m.sec==="Math"?"M":"R"}${m.mod}·${m.q}</span><span class="v"></span></button>`).join("");
[...$("grid").children].forEach(c => c.onclick = () => { if(typeof flush==="function") flush(); cur = +c.dataset.i; render(); });

function render(){
  const m = M[cur], v = V[cur] || {};
  $("shot").src = encodeURIComponent(m.file);
  $("qid").textContent = tag(m);
  $("typ").textContent = m.dom + " · " + m.typ;
  $("conf").textContent = "confidence " + m.c;
  $("bs").style.display = m.note.includes("BLIND SPOT") ? "" : "none";
  $("note").textContent = m.note.replace("BLIND SPOT — ", "");
  const p = pool(), pi = p.indexOf(cur);
  $("pos").textContent = (pi >= 0 ? (pi+1) + " of " + p.length : "not in filter");
  ["s1","s2","s3"].forEach((id,k) => $(id).classList.toggle("on", v.s === k+1));
  $("inp").value = v.q || "";
  const n = M.filter((_,i) => (V[i]||{}).s).length;
  $("count").textContent = n + " / 27";
  $("prog").style.width = (n/27*100) + "%";
  [...$("grid").children].forEach((c,i) => {
    const vv = V[i] || {};
    c.classList.toggle("cur", i === cur);
    c.classList.remove("s1","s2","s3");
    if(vv.s) c.classList.add("s" + vv.s);
    c.querySelector(".v").textContent = vv.s ? ["✓","?","!"][vv.s-1] : "";
  });
  $("grid").querySelector(".cell.cur")?.scrollIntoView({block:"nearest"});
}
function go(d){
  const p = pool(); if(!p.length) return;
  let i = p.indexOf(cur);
  if(i === -1){ cur = p[0]; render(); return; }
  i = Math.min(p.length-1, Math.max(0, i+d)); cur = p[i]; render();
}
let pending = null;
function flush(){ if(pending){ clearTimeout(pending); pending = null; go(1); } }
function setS(k){
  flush();
  rec(cur).s = k; save(); render();
  // verdict 2 means "teach me this" — stay put so the note lands on the right question
  if(k === 2){ $("inp").focus(); return; }
  pending = setTimeout(() => { pending = null; go(1); }, 150);
}
$("s1").onclick = () => setS(1); $("s2").onclick = () => setS(2); $("s3").onclick = () => setS(3);
$("inp").oninput = e => { rec(cur).q = e.target.value; save(); };
$("inp").onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); $("inp").blur(); go(1); } };
$("prev").onclick = () => { flush(); go(-1); }; $("next").onclick = () => { flush(); go(1); };
$("only").onclick = () => { onlyOpen = !onlyOpen;
  $("only").textContent = "Show: " + (onlyOpen ? "untriaged" : "all 27");
  $("only").classList.toggle("on", onlyOpen);
  const p = pool(); if(p.length && !p.includes(cur)) cur = p[0]; render(); };
addEventListener("keydown", e => {
  const t = e.target.tagName; if(t === "INPUT" || t === "TEXTAREA") return;
  if(e.key >= "1" && e.key <= "3") setS(+e.key);
  else if(e.key === "ArrowRight" || e.key === "Enter"){ flush(); go(1); }
  else if(e.key === "ArrowLeft"){ flush(); go(-1); }
  else return;
  e.preventDefault();
});
function md(){
  const lost = M.map((m,i)=>[m,i]).filter(([m,i]) => (V[i]||{}).s === 2);
  const care = M.map((m,i)=>[m,i]).filter(([m,i]) => (V[i]||{}).s === 3);
  const got  = M.map((m,i)=>[m,i]).filter(([m,i]) => (V[i]||{}).s === 1);
  let s = "# Practice 11 — miss review triage\n\n";
  s += "Triaged " + (lost.length+care.length+got.length) + " of 27.\n\n";
  s += "## Teach me these — I still don't understand them (" + lost.length + ")\n\n";
  if(!lost.length) s += "_none_\n";
  for(const [m,i] of lost){
    s += "- **" + tag(m) + "** — " + m.dom + " · " + m.typ;
    if((V[i]||{}).q) s += "\n  - What's confusing: " + V[i].q;
    s += "\n";
  }
  s += "\n## Careless — I knew this, I just slipped (" + care.length + ")\n\n";
  if(!care.length) s += "_none_\n";
  for(const [m,i] of care){
    s += "- **" + tag(m) + "** — " + m.typ;
    if((V[i]||{}).q) s += " — " + V[i].q;
    s += "\n";
  }
  s += "\n## Understood, no action needed (" + got.length + ")\n\n";
  s += got.length ? got.map(([m]) => tag(m)).join(", ") + "\n" : "_none_\n";
  return s;
}
$("exp").onclick = () => { $("out").value = md();
  $("expcount").textContent = M.filter((_,i)=>(V[i]||{}).s).length + " triaged"; $("dlg").showModal(); };
$("close").onclick = () => $("dlg").close();
$("copy").onclick = async () => {
  try{ await navigator.clipboard.writeText($("out").value); }
  catch{ $("out").select(); document.execCommand("copy"); }
  $("copy").textContent = "Copied"; setTimeout(() => $("copy").textContent = "Copy", 1200);
};
$("dl").onclick = () => {
  const b = new Blob([md()],{type:"text/markdown"}), a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = "sat-p11-review.md"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
render();
</script></body></html>
