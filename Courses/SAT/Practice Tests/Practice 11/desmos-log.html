<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAT Practice 11 — Desmos Log</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#14181f;--muted:#6b7280;--line:#e3e6ea;
  --accent:#2f5fd0;--good:#137a45;--bad:#b3261e;--shadow:0 1px 3px rgba(0,0,0,.09)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1216;--panel:#171b21;--ink:#e8eaed;--muted:#98a1ae;--line:#282e37;
  --accent:#7aa2f7;--good:#4ac585;--bad:#f2827a;--shadow:0 1px 3px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0f1216;--panel:#171b21;--ink:#e8eaed;--muted:#98a1ae;
  --line:#282e37;--accent:#7aa2f7;--good:#4ac585;--bad:#f2827a;--shadow:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.bar{flex:1;min-width:110px;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
button.yes.on{background:var(--good);border-color:var(--good)}
button.no.on{background:var(--muted);border-color:var(--muted)}
main{max-width:1180px;margin:0 auto;padding:14px 16px 0}
.qbar{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.qid{font-weight:650;font-size:16px}
.res{font-size:12px;font-weight:650;padding:2px 8px;border-radius:6px}
.res.correct{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.res.incorrect{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.shotwrap{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  box-shadow:var(--shadow);overflow:auto;max-height:46vh;display:flex;justify-content:center}
.shot{max-width:100%;height:auto;display:block}
.form{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:10px 16px 12px;margin-top:12px;box-shadow:0 -1px 3px rgba(0,0,0,.08)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.lab{font-size:12px;color:var(--muted);min-width:112px;font-weight:650}
.row input[type=text]{flex:1;min-width:240px;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.row input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.k{font-size:10px;opacity:.65;margin-left:5px}
.nav{margin-left:auto;display:flex;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:4px;margin:10px 0 4px}
.cell{aspect-ratio:1.35;border-radius:6px;border:1px solid var(--line);background:var(--panel);
  font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;padding:0;gap:1px}
.cell:hover{border-color:var(--accent)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.cell .n{font-weight:650}
.cell .v{font-size:10px;color:var(--muted)}
.cell.done{background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.grid.reveal .cell.miss .n{color:var(--bad)}
.sec-h{font-size:12px;color:var(--muted);margin:12px 0 2px;font-weight:650;letter-spacing:.04em;text-transform:uppercase}
.hint{font-size:12px;color:var(--muted);margin:6px 0 12px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);
  max-width:900px;width:94%;padding:0}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dlg-b{padding:14px 16px}
textarea{width:100%;height:360px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
</style></head><body>
<header>
  <h1>SAT Practice 11 — Desmos Log</h1>
  <span class="pill" id="count"></span>
  <div class="bar"><i id="prog"></i></div>
  <button id="scope" class="on">Math only</button>
  <button id="blind" class="on">Blind: on</button>
  <button id="exp">Export</button>
</header>
<main>
  <div class="qbar">
    <span class="qid" id="qid"></span>
    <span class="res" id="res"></span>
    <span class="pill" id="conf"></span>
    <span class="pill" id="pos"></span>
  </div>
  <div class="shotwrap" id="shotwrap"><img class="shot" id="shot" alt=""></div>
  <div class="sec-h">Jump to question</div>
  <div class="grid" id="grid"></div>
  <p class="hint">Keys: <b>y/n</b> Desmos &middot; <b>1–7</b> what you did &middot; <b>Enter</b> next
  &middot; <b>←/→</b> move &middot; <b>b</b> reveal answer. Saves automatically.</p>
</main>
<div class="form">
  <div class="row"><span class="lab">Used Desmos?</span>
    <button class="yes" id="dy">Yes<span class="k">y</span></button>
    <button class="no" id="dn">No<span class="k">n</span></button>
    <span class="lab" style="min-width:0;margin-left:14px">Would it have helped?</span>
    <button id="wy">Yes</button><button id="wn">No</button>
    <span class="pill">optional</span>
  </div>
  <div class="row"><span class="lab">What you did</span><span id="kinds"></span></div>
  <div class="row"><span class="lab">What you typed in</span>
    <input type="text" id="inp" placeholder="e.g.  y=2x+9y=7  ·  x^2-x-506  ·  left blank, did it by hand" autocomplete="off">
    <span class="nav"><button id="prev">← Prev</button><button id="next">Next →</button></span>
  </div>
</div>
<dialog id="dlg">
  <div class="dlg-h"><b>Export</b><span class="pill" id="expcount"></span>
    <button id="copy" style="margin-left:auto">Copy</button>
    <button id="dl">Download .md</button><button id="close">Close</button></div>
  <div class="dlg-b"><textarea id="out" readonly></textarea></div>
</dialog>

const KINDS = {
  1:"Graphed it / read a point",
  2:"Solved an equation",
  3:"Arithmetic only",
  4:"Table of values",
  5:"Statistics / regression",
  6:"Backsolved the choices",
  7:"By hand — no calculator"
};
const KEY="sat-p11-desmos";
let D = JSON.parse(localStorage.getItem(KEY) || "{}");
let cur = null, blind = true, mathOnly = true;
const $ = id => document.getElementById(id);
const save = () => localStorage.setItem(KEY, JSON.stringify(D));
const pool = () => ALL.filter(it => !mathOnly || it.sec === "Math");
const rec = i => (D[i] = D[i] || {});
const done = i => { const r = D[i]; return r && r.used != null && r.kind != null; };
const tag = it => (it.sec === "Math" ? "Math" : "R&W") + " M" + it.mod + " Q" + it.q;

function buildGrid(){
  $("grid").innerHTML = pool().map(it =>
    `<button class="cell ${it.res==="incorrect"?"miss":""}" data-i="${it.i}">
       <span class="n">${it.sec==="Math"?"M":"R"}${it.mod}·${it.q}</span><span class="v"></span></button>`).join("");
  [...$("grid").children].forEach(c => c.onclick = () => { cur = +c.dataset.i; render(); });
}
function render(){
  const it = ALL[cur];
  $("shot").src = (blind ? "question-only/" : "") + encodeURIComponent(it.file);
  $("qid").textContent = tag(it);
  const r = $("res");
  r.textContent = blind ? "" : (it.res === "correct" ? "Correct" : "Incorrect");
  r.className = "res " + (blind ? "" : it.res);
  $("conf").textContent = it.c ? "confidence " + it.c : "";
  const p = pool(), pi = p.findIndex(x => x.i === cur);
  $("pos").textContent = (pi + 1) + " of " + p.length;
  const d = D[cur] || {};
  $("dy").classList.toggle("on", d.used === true);
  $("dn").classList.toggle("on", d.used === false);
  $("wy").classList.toggle("on", d.help === true);
  $("wn").classList.toggle("on", d.help === false);
  [...$("kinds").children].forEach(b => b.classList.toggle("on", String(d.kind) === b.dataset.k));
  $("inp").value = d.text || "";
  const n = p.filter(x => done(x.i)).length;
  $("count").textContent = n + " / " + p.length;
  $("prog").style.width = (n / p.length * 100) + "%";
  $("grid").classList.toggle("reveal", !blind);
  [...$("grid").children].forEach(c => {
    const i = +c.dataset.i;
    c.classList.toggle("cur", i === cur);
    c.classList.toggle("done", done(i));
    const rr = D[i] || {};
    c.querySelector(".v").textContent = rr.used == null ? "" : (rr.used ? "D" : "–") + (rr.kind || "");
  });
  $("grid").querySelector(".cell.cur")?.scrollIntoView({block:"nearest"});
}
function go(d){
  const p = pool(); let i = p.findIndex(x => x.i === cur);
  if(i === -1){ cur = p[0].i; render(); return; }
  i = Math.min(p.length - 1, Math.max(0, i + d));
  cur = p[i].i; render();
}
function setUsed(v){ rec(cur).used = v; save(); render(); }
function setHelp(v){ rec(cur).help = v; save(); render(); }
function setKind(k){ rec(cur).kind = k; save(); render(); }
$("kinds").innerHTML = Object.entries(KINDS).map(([k,v]) =>
  `<button data-k="${k}">${v}<span class="k">${k}</span></button>`).join(" ");
[...$("kinds").children].forEach(b => b.onclick = () => setKind(+b.dataset.k));
$("dy").onclick = () => setUsed(true);
$("dn").onclick = () => setUsed(false);
$("wy").onclick = () => setHelp(true);
$("wn").onclick = () => setHelp(false);
$("inp").oninput = e => { rec(cur).text = e.target.value; save(); };
$("inp").onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); $("inp").blur(); go(1); } };
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("blind").onclick = () => { blind = !blind;
  $("blind").textContent = "Blind: " + (blind ? "on" : "off");
  $("blind").classList.toggle("on", blind); render(); };
$("scope").onclick = () => { mathOnly = !mathOnly;
  $("scope").textContent = mathOnly ? "Math only" : "All 98";
  $("scope").classList.toggle("on", mathOnly);
  buildGrid(); if(!pool().some(x => x.i === cur)) cur = pool()[0].i; render(); };
addEventListener("keydown", e => {
  const t = e.target.tagName;
  if(t === "INPUT" || t === "TEXTAREA") return;
  const k = e.key.toLowerCase();
  if(k === "y") setUsed(true);
  else if(k === "n") setUsed(false);
  else if(k >= "1" && k <= "7") setKind(+k);
  else if(e.key === "ArrowRight" || e.key === "Enter") go(1);
  else if(e.key === "ArrowLeft") go(-1);
  else if(k === "b") $("blind").click();
  else return;
  e.preventDefault();
});
function md(){
  const p = pool().filter(x => D[x.i] && (D[x.i].used != null || D[x.i].kind != null || D[x.i].text));
  const used = p.filter(x => D[x.i].used === true);
  const missedNoDesmos = p.filter(x => x.res === "incorrect" && D[x.i].used === false && D[x.i].help === true);
  const usedAndMissed  = p.filter(x => x.res === "incorrect" && D[x.i].used === true);
  let s = "# SAT Practice 11 — Desmos usage log\n\n";
  s += "Logged " + p.length + " of " + pool().length + " questions"
     + (mathOnly ? " (Math only)" : " (all sections)") + ".\n\n";
  s += "- Desmos used: **" + used.length + "** of " + p.length + " logged\n";
  s += "- Missed, didn't use it, and it would have helped: **" + missedNoDesmos.length + "**\n";
  s += "- Missed *while* using it: **" + usedAndMissed.length + "**\n\n";
  s += "| Question | Result | Conf | Desmos | Would help | What I did | What I typed |\n";
  s += "|---|---|---|---|---|---|---|\n";
  for(const it of p){
    const d = D[it.i];
    s += "| " + tag(it) + " | " + it.res + " | " + (it.c || "") + " | "
       + (d.used == null ? "" : d.used ? "yes" : "no") + " | "
       + (d.help == null ? "" : d.help ? "yes" : "no") + " | "
       + (KINDS[d.kind] || "") + " | " + (d.text || "").replace(/\|/g, "\\|") + " |\n";
  }
  return s;
}
$("exp").onclick = () => { $("out").value = md();
  $("expcount").textContent = pool().filter(x => done(x.i)).length + " logged"; $("dlg").showModal(); };
$("close").onclick = () => $("dlg").close();
$("copy").onclick = async () => {
  try{ await navigator.clipboard.writeText($("out").value); }
  catch{ $("out").select(); document.execCommand("copy"); }
  $("copy").textContent = "Copied"; setTimeout(() => $("copy").textContent = "Copy", 1200);
};
$("dl").onclick = () => {
  const b = new Blob([md()], {type:"text/markdown"}), a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = "sat-p11-desmos.md"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
buildGrid(); cur = pool()[0].i; render();
</script></body></html>
